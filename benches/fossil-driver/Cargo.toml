# The benchmark's fossil host. Not a member of the workspace on purpose: the empty
# `[workspace]` below keeps it out of `members`, out of `cargo test --workspace` and out of the
# wasm closure, so the benchmark adds nothing to any gate. Its versions are the workspace's,
# spelled out (a non-member cannot inherit them), and `Cargo.lock` starts as a copy of the root
# one so it resolves to the same crates.
[package]
name = "fossil-bench-driver"
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace]

[[bin]]
name = "fossil-bench"
path = "src/main.rs"

[dependencies]
fossil-df = { path = "../../crates/fossil-df" }
fossil-storage = { path = "../../crates/fossil-storage", features = ["object-store"] }
fossil-graph-schema = { path = "../../crates/fossil-graph-schema" }
graphar-info = "0.1.0-alpha.1"
graphar-parquet = "0.1.0-alpha.1"
object_store = { version = "0.13", default-features = false }
futures = "0.3"
tokio = { version = "1", features = ["rt"] }
rml = { git = "https://github.com/Kanzo-Tech/rudof", rev = "cbb80d7ea7bc5639b8a1f716c4ee5ba9ce7195b0", default-features = false, features = ["sql"] }

# The workspace's release profile: what is measured is what ships.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
