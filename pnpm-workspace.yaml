# Two halves, and the difference is whether npm ever sees it.
#   packages/  — the published @fossil-lang/* family. CI stamps and publishes these.
#   docs, apps/ — private hosts. Never published; every recursive CI step filters on
#                 `./packages/*`, so adding one here cannot leak into a release.
packages:
  - 'packages/*'
  - 'apps/*'
  - 'docs'
