<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Multi-host fixture — Phase 10 VIS-01 primitives styleguide</title>
    <style>
      body {
        margin: 0;
        font-family: var(--fossil-fonts-sans, system-ui, -apple-system, sans-serif);
        font-size: var(--fossil-fonts-sizeBase, 14px);
        color: var(--fossil-colors-foreground, #0f172a);
        background: var(--fossil-colors-background, #ffffff);
      }
      main {
        max-width: 1024px;
        margin: 0 auto;
        padding: 2rem 1.5rem;
      }
      header h1 {
        margin-top: 0;
        font-size: 1.5rem;
        font-weight: 600;
      }
      header p {
        color: var(--fossil-colors-muted, #475569);
      }
      section {
        margin-block: 2rem;
      }
      section h2 {
        font-size: 1rem;
        font-weight: 600;
        margin-bottom: 0.75rem;
        padding-bottom: 0.25rem;
        border-bottom: 1px solid var(--fossil-colors-border, #e2e8f0);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>@fossil-lang/ui — primitives styleguide</h1>
        <p>
          Phase 10 VIS-01 oracle. All primitives below are imported from
          <code>@fossil-lang/ui</code> in a vanilla Vite + React host with NO
          Tailwind / NO shadcn / NO Next.js dependency.
        </p>
      </header>
      <div id="root"></div>
    </main>
    <script type="module" src="/main-primitives.tsx"></script>
  </body>
</html>
