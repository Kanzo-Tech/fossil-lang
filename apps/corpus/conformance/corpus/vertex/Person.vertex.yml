type: Person
vertex_count: 300
chunk_size: 64
prefix: vertex/Person/
property_groups:
- file_type: parquet
  properties:
  - name: subject
    data_type: string
    is_primary: true
  - name: birth_year
    data_type: int32
    is_primary: false
  - name: postcode
    data_type: string
    is_primary: false
index:
  prefix: index/
  ordered_by: subject
  chunk_size: 64
codes:
  path: codes.json
version: gar/v1
