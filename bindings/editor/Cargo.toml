[package]
name = "fossil-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "WASM shim for the Fossil compiler — exposes FossilWorkspace to JS"
# Unpublished — no crate here has a release channel (release.yml ships only the npm packages/ family), and this is what lets deny.toml's allow-wildcard-paths accept the sibling path deps.
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false
# `test = false` stood here and it was scaffold boilerplate from `6bb78b4`, the
# commit that created the workspace — no other manifest under `crates/` carries
# it. What it did in the end was switch off the crate's unit tests, which had
# therefore never run: `cargo test -p fossil-wasm` emitted no `Running unittests
# src/lib.rs` line at all, so there was nothing to notice. The `rlib` half of `crate-type` is what makes a unit test
# linkable, and the wasm gate compiles without `--all-targets`, so a test target
# costs the browser build nothing.

[lints]
workspace = true

[dependencies]
# Compiler-core crates wired into FossilWorkspace::compile
# The wasm dep tree is the compiler front-end crates plus WASM glue. NO
# fossil-exec (the graph format and its writer — the editor writes no graph;
# that is fossil-df-wasm's job).
fossil-base    = { path = "../../crates/fossil-base" }
fossil-syntax  = { path = "../../crates/fossil-syntax" }
fossil-hir     = { path = "../../crates/fossil-hir" }
fossil-mir     = { path = "../../crates/fossil-mir" }
smol_str = { workspace = true }
# `Failure` is what every call here refuses with, and `js` the one function
# that throws it as a `FossilError` — shared by the three wasm crates.
fossil-graph-schema = { path = "../../crates/fossil-graph-schema", features = ["js"] }
# The `diagnostics()` method converts byte-offset spans to UTF-16 LSP ranges via
# `fossil_ide::LineIndex` (the rust-analyzer model). fossil-ide is inside the
# WASM gate — wasm32-clean by construction. Wiring this dep lets `check()`
# return the same range shape the native LSP publishes.
fossil-ide = { path = "../../crates/fossil-ide" }
# The profiler the browser runs on its own DuckDB-WASM: sans-IO, so it is wasm32
# like the rest of this tree, and the gate watches it (`/docs/design/profile`).
fossil-profile = { path = "../../crates/fossil-profile" }
# `WasmDb` is a fresh `#[salsa::db]` struct (production hosts own their own db). Needs the
# `salsa::Storage<Self>` field + the `Database` derive macro at the
# trait-object level.
salsa = { workspace = true }

# `lsp_types::{Range, DiagnosticSeverity, CompletionItemKind}` are the shapes
# `check()` and the editor surface in `src/ide.rs` answer in, so a row is the
# LSP's own range and not a second spelling of it. wasm32-clean.
lsp-types = { workspace = true }

# WASM glue — wasm-bindgen exact-pinned at workspace level (=0.2.120) per
# The lib version MUST match the wasm-bindgen-cli
# version installed locally / in CI.
wasm-bindgen             = { workspace = true }
serde-wasm-bindgen       = { workspace = true }
serde                    = { workspace = true }
schemars                 = { workspace = true }
serde_json               = { workspace = true }
js-sys                   = { workspace = true }
console_error_panic_hook = { workspace = true }

# Transitive WASM enablers — keep as direct deps so feature resolution sticks.
# The `wasm_js` feature is what lets getrandom build for wasm32 at all, and who
# needs it is the rudof/ShEx stack, not salsa: `cargo tree -p fossil-wasm -i
# getrandom@0.3.4 --target wasm32-unknown-unknown` arrives through `rand` ←
# `oxrdf` ← `oxrdfio` ← `rudof_rdf` ← `shex_ast`. Salsa's own hashbrown hashes
# with foldhash and draws no randomness. The `.cargo/config.toml`
# rustflag is the belt-and-suspenders fallback for unconditioned call sites.
getrandom = { workspace = true }
uuid      = { workspace = true }

