[workspace]
members = ["crates/*", "bindings/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0 OR MIT"
authors = ["Angel Iglesias <angel.iglesias@kanzo.tech>"]
repository = "https://github.com/Kanzo-Tech/fossil-lang"
homepage = "https://github.com/Kanzo-Tech/fossil-lang"
description = "Fossil — a typed compiler for RDF graph construction"

[workspace.dependencies]
# === Compiler core ===
# The defaults minus `accumulator`: diagnostics travel in query outputs, so
# nothing may push into a side channel (`/docs/design/incremental`).
salsa = { version = "0.28.5", default-features = false, features = ["salsa_unstable", "rayon", "macros", "inventory"] }
rowan = "0.16"
logos = "0.16"
text-size = "1"

# === Diagnostics ===
miette = { version = "7.6", default-features = false }
thiserror = "1"

# === IR / codegen ===
indexmap = "2"
smol_str = "0.3"

# === Serialization ===
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"                               # the WHATWG URL Standard — every URI fossil parses or builds
# `schemars` derives JSON Schema from Rust types, so a wire shape a TypeScript
# package reads is generated from the struct that writes it rather than
# restated by hand. Pin 0.8 because 0.9 is in alpha and the keasy-side TS
# codegen depends on the 0.8 JSON Schema draft-07 dialect for
# openapi-typescript interop.
schemars = { version = "0.8" }
# === The graph: Apache GraphAr, through Kanzo-Tech/graphar (crates.io, `/docs/design/graphar`) ===
# `graphar-info` is the YAML model and `graphar-parquet` the chunk writers, over arrow-rs and
# `object_store` at the majors fossil links. Both build for wasm32 and reach no `tokio`.
graphar-info = "0.1.0-alpha.1"
graphar-parquet = "0.1.0-alpha.1"
# `fossil-storage`'s IO half: a vended credential as a store `DataFusion`
# reads through and fossil writes through. `aws` + `azure` are the stores a
# host vends for, `http` the public URLs no credential covers. Its cloud client
# runs on wasm32 over `fetch` (verified in a browser against MinIO, 2026-09-29).
object_store = { version = "0.13", default-features = false, features = ["aws", "azure", "http"] }
async-trait = "0.1"
futures = "0.3"
web-time = "1"
percent-encoding = "2"

# === Shape documents, RDF and RML: Kanzo-Tech/rudof master at the commit after its per-syntax features (R-d); the owner tags it later ===
# One git source for every rudof crate, so `IriS`, `PrefixMap` and `Object` are one type in all of
# them; the fork leaves `rudof_iri/fetch` and `rudof_rdf/sparql` (reqwest, tokio) off by default, and
# `rudof_rdf` reads only the syntaxes asked for: fossil reads Turtle.
shex_ast = { git = "https://github.com/Kanzo-Tech/rudof", rev = "cbb80d7ea7bc5639b8a1f716c4ee5ba9ce7195b0", default-features = false }
rudof_iri = { git = "https://github.com/Kanzo-Tech/rudof", rev = "cbb80d7ea7bc5639b8a1f716c4ee5ba9ce7195b0", default-features = false }
rudof_rdf = { git = "https://github.com/Kanzo-Tech/rudof", rev = "cbb80d7ea7bc5639b8a1f716c4ee5ba9ce7195b0", default-features = false, features = ["turtle"] }
prefixmap = { git = "https://github.com/Kanzo-Tech/rudof", rev = "cbb80d7ea7bc5639b8a1f716c4ee5ba9ce7195b0", default-features = false }
shacl = { git = "https://github.com/Kanzo-Tech/rudof", rev = "cbb80d7ea7bc5639b8a1f716c4ee5ba9ce7195b0", default-features = false }
# The mapping `describe` builds and writes: `rml`'s AST and its Turtle writer. Its `sql` feature (a
# sqlparser AST, wasm-clean) is a dev-dependency of `fossil-exec`, which renders the mapping to hold it.
rml = { git = "https://github.com/Kanzo-Tech/rudof", rev = "cbb80d7ea7bc5639b8a1f716c4ee5ba9ce7195b0", default-features = false }
# The RDF terms `io.rdf` and the SHACL decoder read, from the graph `rudof_rdf` parses.
#
# `rdf-12` is oxrdf's RDF 1.2 gate and it is OFF by default. It gates `Term::Triple`,
# `Literal::direction`, `BaseDirection` and `rdf::DIR_LANG_STRING`, and pulls in NO new
# dependency. Turtle is parsed by `oxttl` inside `rudof_rdf`, which turns the same gate on for
# the parser; `fossil-exec/src/rdf.rs`'s two RDF 1.2 tests fail at parse time if it stops.
oxrdf = { version = "0.3", features = ["rdf-12"] }
# BCP 47 well-formedness (RFC 5646 §2.2.9) for a language tag the checker and
# the writer hold to it, as RDF 1.1 Concepts §3.3 requires of a literal's tag.
# Already in the lock through `oxrdf`, which validates its own tags with it, so
# naming it adds no crate to the graph or the wasm closure.
oxilangtag = "0.1"
# The N-Triples parser `fossil-exec`'s equivalence test reads the sink's output
# with, so a line it writes is held to a parser and not to its own printer.
# Already in the lock through `rudof_rdf`.
oxttl = { version = "0.2", features = ["rdf-12"] }

# === Did-you-mean diagnostics ===
strsim = "0.11"

# `bytes` is what `object_store` puts and gets — the currency of every file
# `fossil-exec` writes and `fossil-storage` moves. Not a new crate in the tree:
# `object_store` and `datafusion`'s `parquet` already depend on it, so this line names a
# version rather than adding a dependency. Pure Rust, so it costs the wasm32
# gate nothing.
bytes = "1"

# === The engine: DataFusion, in `fossil-exec` and the sinks of `fossil-sinks` ===
# `default-features = false` drops datafusion's `sql` frontend (we build plans
# via the DataFrame/LogicalPlan API, not `ctx.sql()`) and its own `compression`
# feature — shrinking the wasm surface. We KEEP `parquet`: `io.parquet` sources
# must be READ (locally and, in the browser, remotely by signed URL — design C2).
# CSV/JSON reading is core (ungated). Re-add a feature here if a plan op needs it.
#
# ⚠️ This does NOT remove the `zstd` C dep: datafusion 54 HARDCODES
# `arrow-ipc` with `features=["lz4","zstd"]` in datafusion-common /
# datafusion-datasource-arrow / datafusion-physical-plan (not behind any
# feature). So `zstd-sys` cannot be cut from the feature graph — the wasm32
# build needs a wasm-capable clang to compile zstd-C (verified 2026-06-09):
#   CC_wasm32_unknown_unknown=<llvm>/clang AR_wasm32_unknown_unknown=<llvm>/llvm-ar \
#     cargo build -p fossil-exec --target wasm32-unknown-unknown
# (Apple's system clang lacks the wasm target; `brew install llvm` provides one.)
# Cutting zstd entirely would require a `[patch.crates-io]` fork of those three
# subcrates — deferred. The wasm CI job must install LLVM.
#
# `nested_expressions` is ON because a catalogue row asked for it, and that is
# the only reason a feature is on here. `str.split` lowers to `string_split`,
# which reconciles to DataFusion's `string_to_array` — a function that lives in
# the nested-expressions package and is therefore absent from
# `all_default_functions()`. The row was UNRENDERABLE on this engine for want of
# a feature flag, which is a different thing from unrenderable for want of a
# capability, and it was filed beside the ones that cannot be done at all.
#
# `crypto_expressions` is deliberately OFF. It is the sibling package, and no
# function of the language needs its `sha256`. Turning it on would grow the
# wasm surface for a function no template says.
datafusion = { version = "54", default-features = false, features = [
  "parquet",
  "nested_expressions",
] }

# === The native engine — NATIVE ONLY ===
# No crate links it on a normal edge; `fossil-exec` and `fossil-profile` keep it as a
# dev-dependency, to read a written graph back or to bring an engine to a test.
# `deny.toml`'s
# `duckdb` wrappers list is the enforced version of that sentence.
duckdb = { version = "1.10502", features = ["bundled"] }

# === Reference implementations for stdlib fidelity tests (NATIVE ONLY) ===
# `fossil-exec` dev-depends on these to measure its SQL templates against the Rust
# behaviour they are meant to reproduce.
# NEVER referenced by a WASM-gated crate.
unicode-normalization = "0.1"           # the NFC/NFD/NFKC/NFKD reference
slug = "0.1"                            # the URL-slugification reference

# === Editor protocol types ===
# `fossil-ide` returns `lsp_types` structs and `fossil-wasm` hands them to JS.
lsp-types = "0.97"
# rust-analyzer's UTF-8 ↔ UTF-16 line table — the reference the editor host converts by.
line-index = "0.1"

# === WASM ===
wasm-bindgen = "=0.2.120"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
console_error_panic_hook = "0.1"
# `object_store` signs with `chrono::Utc::now()`, which falls through to std's
# `SystemTime::now()` — a panic on wasm32 — unless `wasmbind` is on. A wasm
# crate that reaches `object_store` takes it to turn the feature on.
chrono = { version = "0.4", default-features = false, features = ["clock", "wasmbind"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
uuid = { version = "1", features = ["js"] }

# === Logging ===
# default-features=false to avoid pulling mio, which breaks the WASM gate.
# Only the env-filter and fmt features are needed.
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt"] }

# === Credentials ===
# `secrecy` zeroes its inner memory on drop and forbids `Debug`/`Display` from
# leaking the wrapped value. Adopted in `fossil-storage` (a vended storage
# credential's keys, SAS tokens and session tokens) per the cross-project
# secrecy-always rule.
# Same pin as keasy/server (0.10 + `serde` feature) so the auth values
# round-trip through the keasy config layer without a version mismatch.
secrecy = { version = "0.10", features = ["serde"] }

# Async runtime for the native hosts; each crate says where it keeps it.
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# === Dev / testing ===
expect-test = "1"
# Native temp dirs for integration tests that write Parquet to disk and read it
# back via duckdb — `fossil-exec` and `fossil-profile`, among its
# dev-dependents. Native-only
# (uses a real filesystem); no `tests/` target is built for wasm32.
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "deny"   # per-item #[allow] permitted with justification at third-party-trait integration boundaries (none today; FFI would be one)
missing_debug_implementations = "warn"
unreachable_pub = "warn"
elided_lifetimes_in_paths = "warn"

[workspace.lints.clippy]
# Start permissive; tighten as the codebase matures
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Allow these — they're noisy in compiler code
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Length/structure style lints the codebase has deliberately not adopted: many
# compiler functions are long-by-design (one linear pass), and the first-doc-
# paragraph rule would force reflowing summaries across the whole tree.
too_many_lines = "allow"
too_long_first_doc_paragraph = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# Size-tuned profile for every browser wasm (fossil-wasm, fossil-df-wasm,
# fossil-storage-wasm). Inherits the native release tuning, then trades native
# speed for bytes — all three are fetched over the wire, so size dominates. Built
# via packages/*/scripts/build-wasm.sh (`--profile wasm-release`); wasm-opt -Oz
# runs on top. `panic = "abort"` loses nothing here: wasm32-unknown-unknown has no
# unwinding to lose, and nothing in `crates/` calls `catch_unwind`.
[profile.wasm-release]
inherits = "release"
opt-level = "z"      # optimise for size over speed (vs release's 3)
lto = true           # fat LTO — more cross-crate dead-code removal than "thin"
strip = true         # strip symbols too, not just debuginfo
panic = "abort"      # no unwinding tables (wasm panics trap anyway)
