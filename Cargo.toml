[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0 OR MIT"
authors = ["Angel Iglesias <angel.iglesias@kanzo.tech>"]
repository = "https://github.com/Kanzo-Tech/fossil-lang"
homepage = "https://github.com/Kanzo-Tech/fossil-lang"
description = "Fossil — a typed compiler for RDF graph construction"

[workspace.dependencies]
# === Compiler core ===
salsa = { version = "0.26", features = ["accumulator"] }
rowan = "0.16"
logos = "0.16"
text-size = "1"

# === Diagnostics ===
miette = { version = "7.6", default-features = false }
thiserror = "1"

# === IR / codegen ===
sqlparser = "0.59"
indexmap = "2"
smol_str = "0.3"

# === Serialization ===
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
# `schemars` derives JSON Schema from Rust types. Adopted in `fossil-graph`
# (ADR-0039) to publish a per-verb param/result schema once and have every
# transport binding (fossil-mcp, fossil-http, @fossil-lang/graph) consume the
# SAME schema — no hand-written contract duplicated across bindings. Pin 0.8
# because 0.9 is in alpha and the keasy-side TS codegen depends on the 0.8
# JSON Schema draft-07 dialect for openapi-typescript interop.
schemars = { version = "0.8" }
# `utoipa` derives OpenAPI schemas. Optional + off by default — only the keasy
# host enables it (on `fossil-run-status`) so `RunStatus` lands in keasy's
# openapi.json for openapi-typescript codegen. rmlext's own CLI/WASM builds
# never enable it, so the crate stays dependency-light + WASM-clean.
utoipa = { version = "5" }
# Pure-Rust SHA-256 for the SC#1 cross-engine parity digest (native_baseline.json
# producer in fossil-runtime tests). Already a transitive dep via duckdb/parquet;
# WASM-safe (no C/FFI) though only used in a native-only dev dependency here.
sha2 = "0.10"

# === Input descriptors (Phase 5+, declared here for inheritance) ===
csv = "1.3"
jsonschema = { version = "0.42", default-features = false }
roxmltree = "0.20"

# === Output descriptor (Phase 3+; rudof spike resolved 2026-05-15 — see decisions/rudof-wasm.md) ===
# Major-pinned; allow patch drift. shex_validation intentionally NOT included — Phase 3 is AST-only
# (no runtime ShEx validation), per 03-RESEARCH.md §"Standard Stack".
shex_ast = "0.3"
rudof_iri = "0.3"
prefixmap = "0.3"
# Turtle/N-Triples parsing for the RDF source provider (the oxigraph parser
# rudof's srdf wraps; already resolved transitively via the ShEx crates).
oxttl = "0.2"
oxrdf = "0.3"

# === Did-you-mean diagnostics (Phase 3 CORE-05) ===
strsim = "0.11"

# === Native CLI pre-introspection (Phase 13 INPUT-01 / plan 13-04a) ===
# Source-binding extraction in fossil-cli scans the .fossil text for
# io.csv("...") / io.json("...") references via regex (v0.2 placeholder;
# Phase 14+ replaces with an AST walk). NATIVE-ONLY consumer; never
# referenced by a WASM-gated crate.
regex = "1"

# === Sinks (Phase 5+) ===
# `arrow-schema` sub-crate ONLY for fossil-sinks (DataType names; pulls no mio/arrow-ipc;
# SC#5 / ADR-0017). The `arrow` umbrella + `parquet` stay for native byte-level test deps.
# Pinned to 58 — the latest published arrow/parquet line (59 is not on crates.io as of
# 2026-05; the prior `= "59"` placeholders were aspirational and never resolved). 58.3.0
# is what Cargo.lock already resolves transitively via duckdb's parquet.
arrow-schema = "58"
arrow = "58"
parquet = "58"

# === Runtime — NATIVE ONLY ===
# `vscalar` enables the scalar-UDF registration API (VScalar trait + Connection::
# register_scalar_function) used for the native_udf_only stdlib functions in
# fossil-runtime (STDL-03/05). Native-only crate (wasm32 cfg-tripwire) so these
# never reach the WASM gate.
duckdb = { version = "1.10502", features = ["bundled", "vscalar"] }

# === Native Rust UDF impl crates (Phase 5 STDL-03/05 — NATIVE ONLY) ===
# Implement the native_udf_only stdlib functions registered on the DuckDB
# connection in fossil-runtime. NEVER referenced by a WASM-gated crate (Pitfall 3).
unicode-normalization = "0.1"           # clean.normalize_unicode (NFC/NFD/NFKC/NFKD)
slug = "0.1"                            # clean.slug (URL slugification)
voca_rs = "1"                           # clean.strip_html (strip tags → text)
hmac = "0.12"                           # anon.hmac (keyed HMAC; digest 0.10 compatible with sha2 0.10)

# === LSP — NATIVE ONLY ===
lsp-server = "0.7"
lsp-types = "0.97"
crossbeam-channel = "0.5"

# === CLI — NATIVE ONLY ===
clap = { version = "4", features = ["derive"] }

# === WASM ===
wasm-bindgen = "=0.2.120"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
web-sys = "0.3"
console_log = "1"
console_error_panic_hook = "0.1"
getrandom = { version = "0.3", features = ["wasm_js"] }
uuid = { version = "1", features = ["js"] }

# === Logging (CLI + LSP — NATIVE ONLY in Phase 1) ===
# default-features=false to avoid pulling mio (which breaks the WASM gate per RESEARCH.md Pitfall 3).
# Only the env-filter and fmt features are needed for Phase 1.
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt"] }

# === Credentials ===
# `secrecy` zeroes its inner memory on drop and forbids `Debug`/`Display` from
# leaking the wrapped value. Adopted in `fossil-resolver` (the resolver
# carries provider-specific cloud-auth keys: `azure_storage_account_key`,
# `aws_access_key_secret`, etc.) per the cross-project secrecy-always rule.
# Same pin as keasy/server (0.10 + `serde` feature) so the auth values
# round-trip through the keasy config layer without a version mismatch.
secrecy = { version = "0.10", features = ["serde"] }

# `rmcp` — the official Rust MCP SDK. `fossil-mcp` exposes the verb surface as
# MCP tools over stdio (server) and keasy invokes it as a subprocess (the host
# uses the client side). Native-only (spawns a child + DuckDB); never WASM.
rmcp = { version = "0.16", features = ["server", "macros", "transport-io"] }
# Async runtime for the MCP server (rmcp is tokio-based).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }

# === Dev / testing ===
insta = { version = "1", features = ["yaml"] }
expect-test = "1"
wasm-bindgen-test = "0.3"
# Native temp dirs for fossil-runtime W0b/4 integration tests that
# write GraphAr Parquet to disk and read back via duckdb. Native-only
# (uses real filesystem); not in the WASM gate.
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "deny"   # per ADR-0004 — per-item #[allow] permitted with justification at third-party-trait integration boundaries (e.g., Salsa Update for rowan types)
missing_debug_implementations = "warn"
unreachable_pub = "warn"
elided_lifetimes_in_paths = "warn"

[workspace.lints.clippy]
# Start permissive; tighten as the codebase matures
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Allow these — they're noisy in compiler code
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Length/structure style lints the codebase has deliberately not adopted: many
# compiler functions are long-by-design (one linear pass), and the first-doc-
# paragraph rule would force reflowing summaries across the whole tree.
too_many_lines = "allow"
too_long_first_doc_paragraph = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.wasm-release]
inherits = "release"
opt-level = "z"
