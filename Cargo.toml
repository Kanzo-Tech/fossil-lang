[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0 OR MIT"
authors = ["Angel Iglesias <angel.iglesias@kanzo.tech>"]
repository = "https://github.com/Kanzo-Tech/fossil-lang"
homepage = "https://github.com/Kanzo-Tech/fossil-lang"
description = "Fossil — a typed compiler for RDF graph construction"

[workspace.dependencies]
# === Compiler core ===
salsa = { version = "0.26", features = ["accumulator"] }
rowan = "0.16"
logos = "0.16"
text-size = "1"

# === Diagnostics ===
miette = { version = "7.6", default-features = false }
thiserror = "1"

# === IR / codegen ===
sqlparser = "0.59"
indexmap = "2"
smol_str = "0.3"

# === Serialization ===
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
# `schemars` derives JSON Schema from Rust types. Adopted in `fossil-graph`
# to publish a per-verb param/result schema once and have every
# transport binding (fossil-mcp, fossil-http, @fossil-lang/graph) consume the
# SAME schema — no hand-written contract duplicated across bindings. Pin 0.8
# because 0.9 is in alpha and the keasy-side TS codegen depends on the 0.8
# JSON Schema draft-07 dialect for openapi-typescript interop.
schemars = { version = "0.8" }
# Pure-Rust SHA-256 for the cross-engine parity digest (native_baseline.json
# producer in fossil-layout tests). Already a transitive dep via duckdb/parquet;
# WASM-safe (no C/FFI) though only used in a native-only dev dependency here.
sha2 = "0.10"

# === Input descriptors (declared here for inheritance) ===
csv = "1.3"
jsonschema = { version = "0.42", default-features = false }
roxmltree = "0.20"

# === Output descriptor (the rudof WASM spike resolved this 2026-05-15) ===
# Major-pinned; allow patch drift. shex_validation intentionally NOT included — the checker walks
# the ShEx AST only, and never runs ShEx validation.
shex_ast = "0.3"
rudof_iri = "0.3"
prefixmap = "0.3"
# Turtle/N-Triples parsing for the RDF source provider (the oxigraph parser
# rudof's srdf wraps; already resolved transitively via the ShEx crates).
#
# `rdf-12` is oxttl/oxrdf's RDF 1.2 gate and it is OFF by default. Measured
# 2026-08-07 against oxttl 0.2.3 outside this workspace: with it off, `<<( … )>>`
# fails with "`<<(` is not a valid RDF object" and `"x"@en--ltr` with "Literal
# base direction are only allowed in RDF 1.2"; with it on, both parse. It gates
# `Term::Triple`, `Literal::direction`, `BaseDirection` and `rdf::DIR_LANG_STRING`,
# and pulls in NO new dependency — `oxttl/rdf-12 = ["oxrdf/rdf-12"]` and
# `oxrdf/rdf-12 = []`, so the wasm closure is unchanged.
#
# It was ALREADY on in every build of this workspace, by feature unification from
# `rudof_iri`/`rudof_rdf`, never by our own declaration — which is why the
# `Term::Triple` arm in `fossil-df/src/rdf.rs` compiles today. That made our RDF
# 1.2 reach a property of rudof's dependency graph: dropping rudof, or rudof
# dropping the feature, turns our Turtle parser back into an RDF 1.1 one and
# breaks that arm at compile time for a reason no one would connect. Declaring it
# here is a no-op for today's graph and the guard for tomorrow's.
oxttl = { version = "0.2", features = ["rdf-12"] }
oxrdf = { version = "0.3", features = ["rdf-12"] }

# === Did-you-mean diagnostics ===
strsim = "0.11"

# === Native CLI pre-introspection ===
# Source-binding extraction in fossil-cli scans the .fossil text for
# io.csv("...") / io.json("...") references via regex. It is a placeholder for
# an AST walk, and it is wrong on any binding a regex cannot see. NATIVE-ONLY
# consumer; never referenced by a WASM-gated crate.
regex = "1"

# === Sinks ===
# `arrow-schema` sub-crate ONLY for fossil-sinks (DataType names; pulls no mio/arrow-ipc,
# either of which would break the wasm32 gate). The `arrow` umbrella + `parquet` stay
# for native byte-level test deps.
# Pinned to 58 — the latest published arrow/parquet line (59 is not on crates.io as of
# 2026-05; the prior `= "59"` placeholders were aspirational and never resolved). 58.3.0
# is what Cargo.lock already resolves transitively via duckdb's parquet.
arrow-schema = "58"
arrow = "58"
parquet = "58"

# === The native engine — NATIVE ONLY ===
# `fossil-introspect` is the one crate on a normal edge; `fossil-engine`,
# `fossil-layout`, `fossil-mcp` and `fossil-cli` keep it as a dev-dependency, to
# read written Parquet back or to bring an engine to a test. `deny.toml`'s
# `duckdb` wrappers list is the enforced version of that sentence.
#
# `vscalar` enables the scalar-UDF registration API (VScalar trait +
# Connection::register_scalar_function). It was for the `native_udf_only` stdlib
# functions, and ruling 15 of `SURFACE-PLAN.md` deleted the `Udf` lowering kind
# and `fossil-layout/src/udf.rs` with it: `grep -rn 'VScalar\|register_scalar_function'
# crates/` now finds nothing, so the feature has no user left.
duckdb = { version = "1.10502", features = ["bundled", "vscalar"] }

# === Reference implementations for stdlib fidelity tests (NATIVE ONLY) ===
# These were the UDF impl crates behind a `Udf` lowering kind that no longer
# exists; what survives is `fossil-df`'s dev-dependency on them, which measures
# the SQL template against the Rust behaviour it is meant to reproduce.
# NEVER referenced by a WASM-gated crate.
unicode-normalization = "0.1"           # the NFC/NFD/NFKC/NFKD reference
slug = "0.1"                            # the URL-slugification reference

# === LSP — NATIVE ONLY ===
lsp-server = "0.7"
lsp-types = "0.97"
crossbeam-channel = "0.5"

# === CLI — NATIVE ONLY ===
clap = { version = "4", features = ["derive"] }

# === WASM ===
wasm-bindgen = "=0.2.120"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
web-sys = "0.3"
console_log = "1"
console_error_panic_hook = "0.1"
getrandom = { version = "0.3", features = ["wasm_js"] }
uuid = { version = "1", features = ["js"] }

# === Logging (CLI + LSP — NATIVE ONLY) ===
# default-features=false to avoid pulling mio, which breaks the WASM gate.
# Only the env-filter and fmt features are needed.
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt"] }

# === Credentials ===
# `secrecy` zeroes its inner memory on drop and forbids `Debug`/`Display` from
# leaking the wrapped value. Adopted in `fossil-resolver` (the resolver
# carries provider-specific cloud-auth keys: `azure_storage_account_key`,
# `aws_access_key_secret`, etc.) per the cross-project secrecy-always rule.
# Same pin as keasy/server (0.10 + `serde` feature) so the auth values
# round-trip through the keasy config layer without a version mismatch.
secrecy = { version = "0.10", features = ["serde"] }

# `rmcp` — the official Rust MCP SDK. `fossil-mcp` exposes the verb surface as
# MCP tools over stdio (server) and keasy invokes it as a subprocess (the host
# uses the client side). Native-only (spawns a child + DuckDB); never WASM.
rmcp = { version = "0.16", features = ["server", "macros", "transport-io"] }
# Async runtime for the MCP server (rmcp is tokio-based).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }

# === Dev / testing ===
insta = { version = "1", features = ["yaml"] }
expect-test = "1"
wasm-bindgen-test = "0.3"
# Native temp dirs for integration tests that write Parquet to disk and read it
# back via duckdb — `fossil-engine`, `fossil-df` and `fossil-introspect`, which
# are its three dev-dependents. (It named `fossil-layout` here and that crate
# dropped it along with the `tests/graphar_decomp.rs` it served.) Native-only
# (uses a real filesystem); no `tests/` target is built for wasm32.
tempfile = "3"
# The spill test (fossil-df tests/spill.rs) reads DataFusion's own log records:
# an operator that spills says so through `log`, and nothing else survives the
# run to be asserted on. Dev-dep only — fossil emits `tracing`, not `log`.
log = "0.4"

[workspace.lints.rust]
unsafe_code = "deny"   # per-item #[allow] permitted with justification at third-party-trait integration boundaries (e.g., Salsa Update for rowan types)
missing_debug_implementations = "warn"
unreachable_pub = "warn"
elided_lifetimes_in_paths = "warn"

[workspace.lints.clippy]
# Start permissive; tighten as the codebase matures
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Allow these — they're noisy in compiler code
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Length/structure style lints the codebase has deliberately not adopted: many
# compiler functions are long-by-design (one linear pass), and the first-doc-
# paragraph rule would force reflowing summaries across the whole tree.
too_many_lines = "allow"
too_long_first_doc_paragraph = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# Size-tuned profile for the browser wasm (fossil-df-wasm). Inherits the native
# release tuning, then trades native speed for bytes — the executor is
# lazy-loaded over the wire, so size dominates. Built via packages/executor's
# build-wasm.sh (`--profile wasm-release`); wasm-opt -Oz runs on top.
[profile.wasm-release]
inherits = "release"
opt-level = "z"      # optimise for size over speed (vs release's 3)
lto = true           # fat LTO — more cross-crate dead-code removal than "thin"
strip = true         # strip symbols too, not just debuginfo
panic = "abort"      # no unwinding tables (wasm panics trap anyway)
