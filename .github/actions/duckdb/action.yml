name: duckdb
description: >
  The DuckDB CLI from the project's own release asset, pinned: the corpus guards
  and integration suites read Parquet footer statistics, and a silent CLI major
  should turn a run red on purpose rather than by surprise.
runs:
  using: composite
  steps:
    - name: Install the duckdb binary
      shell: bash
      env:
        DUCKDB_VERSION: v1.5.3
      run: |
        curl -fsSL -o /tmp/duckdb.zip \
          "https://github.com/duckdb/duckdb/releases/download/${DUCKDB_VERSION}/duckdb_cli-linux-amd64.zip"
        unzip -q -o /tmp/duckdb.zip -d /usr/local/bin
        chmod +x /usr/local/bin/duckdb
        duckdb -version
