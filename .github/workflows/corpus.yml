name: corpus

# The corpus guards, on CI.
#
# `pnpm-ci.yml` filters every recursive step to `./packages/*`, `docs.yml` is filtered to
# `docs/**`, and there is no git hook in this repo — so without this file
# `node guards/self-test.mjs` (every guard fired against a corpus broken in exactly one way)
# would run only when somebody typed it.
#
# It is a workflow of its own rather than a step in `pnpm-ci.yml` for the reason `docs.yml`
# gives: that job's ceiling is 60 minutes because a cold run compiles datafusion to wasm, and
# this one has no business waiting for it.
#
# The install list is the point of these guards, not an accident of it: `node` and the
# `duckdb` binary, no `pnpm install`, no `node_modules`, no Rust, no fossil. If a step below
# ever needs a third thing, the claim in `guards/README.md` — "take this directory, it is
# meant to be copied" — has stopped being true and the fix is in the guards, not here.
#
# **`packages/corpus/integration/` is not run here, and that is the same refusal**: those
# suites are vitest over the workspace's `@duckdb/duckdb-wasm`. `pnpm-ci.yml` runs them.

on:
  pull_request:
    paths:
      - 'packages/corpus/**'
      - '.github/workflows/corpus.yml'
  push:
    branches: [main]
    paths:
      - 'packages/corpus/**'
      - '.github/workflows/corpus.yml'

jobs:
  corpus:
    runs-on: ubuntu-latest
    # Minutes. `self-test.mjs` writes a 6,000-vertex fixture and rewrites it once per
    # mutation — seconds, measured; the ceiling is for a slow runner, not for the work.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: ./.github/actions/duckdb

      # Non-vacuity first, then one mutation per guard: every guard is required to FIRE
      # against a corpus broken in exactly the way it exists to catch.
      - name: Guards self-test
        working-directory: packages/corpus
        run: node guards/self-test.mjs

      # The checked-in conformance corpus, through the guards — the corpus `packages/corpus`'s
      # own tests open.
      - name: Guards against the conformance corpus
        working-directory: packages/corpus
        run: node guards/check.mjs conformance/corpus

      # The checked-in corpus is generated, and `RECIPE` in the file is the command. This
      # regenerates it into a temporary directory and requires the same manifest and rows.
      - name: The conformance corpus reproduces from its recorded recipe
        working-directory: packages/corpus
        run: node conformance/provenance.mjs
