name: pnpm-ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pnpm:
    runs-on: ubuntu-latest
    # Generous ceiling for a COLD run (no cargo cache yet: datafusion wasm in
    # @fossil-lang/executor + fossil-cli --release in @fossil-lang/examples build
    # from scratch). Warm runs (cache hit) finish in a few minutes; this only
    # catches a genuine hang, not a slow first build.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # `pnpm -r build` builds @fossil-lang/wasm + graph + executor, whose
      # `build:wasm` needs the Rust toolchain + wasm-bindgen-cli (same setup
      # release.yml uses).
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          targets: wasm32-unknown-unknown

      # Cache cargo registry + target across runs. Without it every PR rebuilds
      # datafusion (the executor's wasm) + fossil-cli from scratch (~20-40 min,
      # the likely cause of the canceled run). Warm runs reuse the build.
      - uses: Swatinem/rust-cache@v2
        with:
          # The wasm32 artifacts + the native fossil-cli release build both land
          # in target/; cache keyed on Cargo.lock + toolchain by default.
          cache-all-crates: true

      - name: Install wasm-bindgen-cli (0.2.120, matches Cargo.toml pin)
        run: cargo install --version 0.2.120 wasm-bindgen-cli

      # datafusion (in @fossil-lang/executor's build:wasm) hardcodes
      # arrow-ipc[zstd], so the wasm32 zstd-sys C build needs a wasm-capable
      # clang (Apple/macOS clang lacks the target; ubuntu's LLVM clang has it).
      # Point cc-rs at it for the wasm32 target.
      - name: Install LLVM for wasm zstd-C (@fossil-lang/executor)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang llvm
          echo "CC_wasm32_unknown_unknown=clang" >> "$GITHUB_ENV"
          echo "AR_wasm32_unknown_unknown=llvm-ar" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build WASM first — every TS package downstream depends on the wasm-bindgen output
      # being present in packages/wasm/pkg/. This step is a no-op early in Phase 8
      # (the @fossil-lang/wasm package doesn't exist yet; its script will be `echo ok`).
      # Once 08-06 lands, this builds the real artifact.
      - name: Build wasm
        run: pnpm --filter "@fossil-lang/wasm" run build:wasm || echo "no @fossil-lang/wasm yet"

      - name: Build all packages
        run: pnpm -r build

      - name: Test all packages
        run: pnpm -r test

      - name: Type-check all packages
        run: pnpm -r exec tsc --noEmit

      # PKG-03 JS half — enforce per-package bundle budgets via size-limit.
      # Currently only @fossil-lang/playground declares a size script + budget
      # (500 KB gzip per CONTEXT.md SC#4 + 08-VERIFICATION.md gap 2). Future
      # packages with budgets are picked up automatically by `pnpm -r`.
      # The WASM half of PKG-03 is enforced separately by wasm-size.yml.
      - name: Bundle size budget (PKG-03 JS half)
        run: pnpm -r size
