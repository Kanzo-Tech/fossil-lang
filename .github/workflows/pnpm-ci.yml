name: pnpm-ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pnpm:
    runs-on: ubuntu-latest
    # Generous ceiling for a COLD run (no cargo cache yet: datafusion wasm in
    # @fossil-lang/executor builds from scratch). Warm runs (cache hit) finish in
    # a few minutes; this only catches a genuine hang, not a slow first build.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # `pnpm -r build` builds @fossil-lang/wasm + storage + executor, whose
      # `build:wasm` needs the Rust toolchain + wasm-bindgen-cli (same setup
      # release.yml uses).
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          targets: wasm32-unknown-unknown

      # Cache cargo registry + target across runs. Without it every PR rebuilds
      # datafusion (the executor's wasm) from scratch (~20-40 min,
      # the likely cause of the canceled run). Warm runs reuse the build.
      - uses: Swatinem/rust-cache@v2
        with:
          # The wasm32 artifacts land in target/; cache keyed on Cargo.lock +
          # toolchain by default.
          cache-all-crates: true

      - name: Install wasm-bindgen-cli (0.2.120, matches Cargo.toml pin)
        run: cargo install --version 0.2.120 wasm-bindgen-cli

      # datafusion (in @fossil-lang/executor's build:wasm) hardcodes arrow-ipc[zstd],
      # so the wasm32 zstd-sys C build needs a wasm-capable clang (Apple/macOS clang
      # lacks the target; ubuntu's LLVM clang has it). Point cc-rs at it.
      - name: Install LLVM for wasm zstd-C (@fossil-lang/executor)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang llvm
          echo "CC_wasm32_unknown_unknown=clang" >> "$GITHUB_ENV"
          echo "AR_wasm32_unknown_unknown=llvm-ar" >> "$GITHUB_ENV"

      # wasm-opt via the `wasm-opt` crate (binaryen 116). NOT apt binaryen: ubuntu
      # ships 108, whose wasm-opt corrupts wasm-bindgen's externref table (binaryen
      # #4711) → "Table.grow(): failed to grow table" instantiating a wasm-bindgen
      # module on Node 20. 116 fixes it. Same cargo-install pattern as wasm-bindgen-cli.
      - name: Install wasm-opt (binaryen 116 via the wasm-opt crate)
        run: cargo install wasm-opt --locked --version 0.116.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build WASM first — every TS package downstream depends on the wasm-bindgen output
      # being present in packages/wasm/pkg/. The `|| echo` fallback keeps the job
      # green if the package has no build script yet.
      - name: Build wasm
        run: pnpm --filter "@fossil-lang/wasm" run build:wasm || echo "no @fossil-lang/wasm yet"

      # Scoped to packages/ because the workspace also holds `docs`, which this
      # job must not build: the ceiling below is already 60 minutes for a cold
      # cargo build, and the docs have their own path-filtered `docs.yml`.
      - name: Build all packages
        run: pnpm --filter "./packages/*" build

      # There is no exclusion here any more. `@fossil-lang/examples` was carved
      # out because its variations harness built the native CLI (datafusion/duckdb
      # — minutes) just to spawn `fossil check`, and `examples.yml` owned that
      # gate. All three are gone: the acceptance corpus is `docs/programs/`, run
      # by `crates/fossil-df/tests/programs.rs`, which is a Rust test on the
      # Rust side of the seam and never enters a pnpm filter.
      # For `packages/corpus/integration/`, two steps down. They were
      # `packages/corpus/tests/{address-cost,cost,containers,frame-levels}.test.ts`,
      # they probed for the binary with `spawnSync` and hid behind
      # `describe.skipIf(!hasDuckdb)`, and this step was added so they would stop
      # reporting GREEN with zero assertions. It did not finish the job: the skip
      # applies to the TESTS and the describe BODY runs regardless, so the fixture
      # write at the top of `address-cost.test.ts` ran anyway — and on the release
      # runner, which installs no duckdb, it took `v0.3.0-alpha.4` down. The suites
      # are declared now rather than probed: they live in `integration/`, outside
      # `tests/`, and the script that runs them is the one this job names.
      # Pinned for the reason `corpus.yml` gives beside the same block — these
      # suites read Parquet footer statistics, and a silent CLI major should turn a
      # run red on purpose rather than by surprise.
      - name: Install the duckdb binary (for the corpus integration suites)
        env:
          DUCKDB_VERSION: v1.5.3
        run: |
          curl -fsSL -o /tmp/duckdb.zip \
            "https://github.com/duckdb/duckdb/releases/download/${DUCKDB_VERSION}/duckdb_cli-linux-amd64.zip"
          unzip -q -o /tmp/duckdb.zip -d /usr/local/bin
          chmod +x /usr/local/bin/duckdb
          duckdb -version

      - name: Test all packages
        run: pnpm --filter "./packages/*" test

      # The suites that write a corpus with the `duckdb` binary and read it back through
      # `packages/corpus/src` on DuckDB-WASM: every table at its record_count, and a box that
      # reads fewer row groups than the file has.
      #
      # It is a step HERE and not a job in `corpus.yml`, which is the other file that
      # installs this binary, because `corpus.yml` states its install list as the point of
      # the guards rather than an accident of them — `node` and `duckdb`, no `pnpm install`,
      # no `node_modules`. These suites need vitest and the workspace's
      # `@duckdb/duckdb-wasm`, and this job already has both.
      #
      # Named, not recursive: `test:integration` is a script of `@fossil-lang/corpus` and
      # not part of its `test`, which `release.yml` runs before publishing on a runner with
      # no duckdb.
      - name: Corpus integration (the suites that need a real duckdb)
        run: pnpm --filter "@fossil-lang/corpus" test:integration

      - name: Type-check all packages
        run: pnpm --filter "./packages/*" exec tsc --noEmit
