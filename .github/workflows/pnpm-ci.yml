name: pnpm-ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pnpm:
    runs-on: ubuntu-latest
    # Generous ceiling for a COLD run (no cargo cache yet: datafusion wasm in
    # @fossil-lang/executor builds from scratch). Warm runs (cache hit) finish in
    # a few minutes; this only catches a genuine hang, not a slow first build.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # `pnpm -r build` builds @fossil-lang/wasm + graph + executor, whose
      # `build:wasm` needs the Rust toolchain + wasm-bindgen-cli (same setup
      # release.yml uses).
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          targets: wasm32-unknown-unknown

      # Cache cargo registry + target across runs. Without it every PR rebuilds
      # datafusion (the executor's wasm) + fossil-cli from scratch (~20-40 min,
      # the likely cause of the canceled run). Warm runs reuse the build.
      - uses: Swatinem/rust-cache@v2
        with:
          # The wasm32 artifacts + the native fossil-cli release build both land
          # in target/; cache keyed on Cargo.lock + toolchain by default.
          cache-all-crates: true

      - name: Install wasm-bindgen-cli (0.2.120, matches Cargo.toml pin)
        run: cargo install --version 0.2.120 wasm-bindgen-cli

      # datafusion (in @fossil-lang/executor's build:wasm) hardcodes arrow-ipc[zstd],
      # so the wasm32 zstd-sys C build needs a wasm-capable clang (Apple/macOS clang
      # lacks the target; ubuntu's LLVM clang has it). Point cc-rs at it.
      - name: Install LLVM for wasm zstd-C (@fossil-lang/executor)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang llvm
          echo "CC_wasm32_unknown_unknown=clang" >> "$GITHUB_ENV"
          echo "AR_wasm32_unknown_unknown=llvm-ar" >> "$GITHUB_ENV"

      # wasm-opt via the `wasm-opt` crate (binaryen 116). NOT apt binaryen: ubuntu
      # ships 108, whose wasm-opt corrupts wasm-bindgen's externref table (binaryen
      # #4711) → "Table.grow(): failed to grow table" instantiating the graph wasm
      # on Node 20. 116 fixes it. Same cargo-install pattern as wasm-bindgen-cli.
      - name: Install wasm-opt (binaryen 116 via the wasm-opt crate)
        run: cargo install wasm-opt --locked --version 0.116.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build WASM first — every TS package downstream depends on the wasm-bindgen output
      # being present in packages/wasm/pkg/. This step is a no-op early in Phase 8
      # (the @fossil-lang/wasm package doesn't exist yet; its script will be `echo ok`).
      # Once 08-06 lands, this builds the real artifact.
      - name: Build wasm
        run: pnpm --filter "@fossil-lang/wasm" run build:wasm || echo "no @fossil-lang/wasm yet"

      # Scoped to packages/ because the workspace also holds `apps/*`, which this
      # job must not build: the ceiling below is already 60 minutes for a cold
      # cargo build, and the docs app has its own path-filtered `docs.yml`.
      - name: Build all packages
        run: pnpm --filter "./packages/*" build

      # There is no exclusion here any more. `@fossil-lang/examples` was carved
      # out because its variations harness built `fossil-cli` (datafusion/duckdb
      # — minutes) just to spawn `fossil check`, and `examples.yml` owned that
      # gate. Both are gone: the acceptance corpus is `apps/docs/programs/`, run
      # by `crates/fossil-engine/tests/programs.rs`, which is a Rust test on the
      # Rust side of the seam and never enters a pnpm filter.
      - name: Test all packages
        run: pnpm --filter "./packages/*" test

      - name: Type-check all packages
        run: pnpm --filter "./packages/*" exec tsc --noEmit
