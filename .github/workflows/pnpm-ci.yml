name: pnpm-ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pnpm:
    runs-on: ubuntu-latest
    # Generous ceiling for a COLD run (no cargo cache yet: datafusion wasm in
    # @fossil-lang/executor builds from scratch). Warm runs (cache hit) finish in
    # a few minutes; this only catches a genuine hang, not a slow first build.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # `build:wasm` of @fossil-lang/wasm, storage and executor.
      - uses: ./.github/actions/wasm-toolchain

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build WASM first — every TS package downstream depends on the wasm-bindgen output
      # being present in packages/wasm/pkg/.
      - name: Build wasm
        run: pnpm --filter "@fossil-lang/wasm" run build:wasm

      # The module the package ships, measured as it ships: at most 2 MiB gzipped,
      # and the whole of `pkg/` at most 10 MiB.
      - name: WASM size budget
        run: |
          size=$(gzip -9 -c packages/wasm/pkg/fossil_wasm_bg.wasm | wc -c)
          total=$(du -bsc packages/wasm/pkg/* | tail -1 | cut -f1)
          echo "fossil_wasm_bg.wasm: $size bytes gzipped (limit 2097152); pkg/: $total bytes (limit 10485760)"
          [ "$size" -le 2097152 ] && [ "$total" -le 10485760 ]

      # Scoped to packages/ because the workspace also holds `docs`, which this
      # job must not build: the ceiling below is already 60 minutes for a cold
      # cargo build, and the docs have their own path-filtered `docs.yml`.
      - name: Build all packages
        run: pnpm --filter "./packages/*" build

      # There is no exclusion here any more. `@fossil-lang/examples` was carved
      # out because its variations harness built the native CLI (datafusion/duckdb
      # — minutes) just to spawn `fossil check`, and `examples.yml` owned that
      # gate. All three are gone: the acceptance corpus is `docs/programs/`, run
      # by `crates/fossil-df/tests/programs.rs`, which is a Rust test on the
      # Rust side of the seam and never enters a pnpm filter.
      # For `packages/corpus/integration/`, two steps down. They were
      # `packages/corpus/tests/{address-cost,cost,containers,frame-levels}.test.ts`,
      # they probed for the binary with `spawnSync` and hid behind
      # `describe.skipIf(!hasDuckdb)`, and this step was added so they would stop
      # reporting GREEN with zero assertions. It did not finish the job: the skip
      # applies to the TESTS and the describe BODY runs regardless, so the fixture
      # write at the top of `address-cost.test.ts` ran anyway — and on the release
      # runner, which installs no duckdb, it took `v0.3.0-alpha.4` down. The suites
      # are declared now rather than probed: they live in `integration/`, outside
      # `tests/`, and the script that runs them is the one this job names.
      - uses: ./.github/actions/duckdb

      - name: Test all packages
        run: pnpm --filter "./packages/*" test

      # The suites that write a corpus with the `duckdb` binary and read it back through
      # `packages/corpus/src` on DuckDB-WASM: every table at its record_count, and a box that
      # reads fewer row groups than the file has.
      #
      # It is a step HERE and not a job in `corpus.yml`, which is the other file that
      # installs this binary, because `corpus.yml` states its install list as the point of
      # the guards rather than an accident of them — `node` and `duckdb`, no `pnpm install`,
      # no `node_modules`. These suites need vitest and the workspace's
      # `@duckdb/duckdb-wasm`, and this job already has both.
      #
      # Named, not recursive: `test:integration` is a script of `@fossil-lang/corpus` and
      # not part of its `test`, which `release.yml` runs before publishing on a runner with
      # no duckdb.
      - name: Corpus integration (the suites that need a real duckdb)
        run: pnpm --filter "@fossil-lang/corpus" test:integration

      - name: Lint
        run: pnpm exec eslint .

      - name: Type-check all packages
        run: pnpm --filter "./packages/*" exec tsc --noEmit
