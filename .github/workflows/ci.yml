name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.90"
          components: rustfmt
          cache: false  # fmt-only is too cheap to cache
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.90"
          components: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings

  native:
    name: native (cargo check + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.90"
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace

  wasm:
    name: wasm (cargo check on gated crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.90"
          target: wasm32-unknown-unknown
      - name: cargo check --target wasm32-unknown-unknown
        run: |
          cargo check --target wasm32-unknown-unknown \
            -p fossil-base \
            -p fossil-syntax \
            -p fossil-hir \
            -p fossil-mir \
            -p fossil-codegen \
            -p fossil-sinks \
            -p fossil-ide \
            -p fossil-ide-db \
            -p fossil-wasm
      - name: cargo build --release for fossil-wasm (smoke)
        run: cargo build --target wasm32-unknown-unknown --release -p fossil-wasm

  deny:
    name: cargo-deny (advisories + licenses + bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "1.90"
