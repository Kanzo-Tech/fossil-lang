name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.90"
          components: rustfmt
          cache: false  # fmt-only is too cheap to cache
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.90"
          components: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings

  native:
    name: native (cargo check + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.90"
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace
      # SC#2 (ADR-0021): the HARD didChange-budget gate. A margined wall-clock
      # correctness test — catches algorithmic blow-up in the per-keystroke
      # analysis round-trip without flaking on CI noise (the design goal is
      # <100ms; the gate budget has margin). Run explicitly so a regression here
      # is attributed, not buried in the workspace test summary.
      - name: SC#2 didChange budget (hard gate)
        run: cargo test -p fossil-lsp --test didchange_budget -- --nocapture
      # ADVISORY: the Criterion didChange benchmark. Informational on shared CI
      # (the 20%-regression comparison is reliable only on a pinned/self-hosted
      # runner — see ADR-0021); `--no-run` here just proves the harness compiles
      # so the bench cannot rot. Full timing runs on a controlled runner.
      - name: SC#2 didChange benchmark (advisory — compile only on shared CI)
        run: cargo bench -p fossil-lsp --no-run
        continue-on-error: true

  wasm:
    name: wasm (cargo check on gated crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.90"
          target: wasm32-unknown-unknown
      - name: cargo check --target wasm32-unknown-unknown
        run: |
          cargo check --target wasm32-unknown-unknown \
            -p fossil-base \
            -p fossil-syntax \
            -p fossil-hir \
            -p fossil-mir \
            -p fossil-codegen \
            -p fossil-sinks \
            -p fossil-ide \
            -p fossil-ide-db \
            -p fossil-wasm
      - name: cargo build --release for fossil-wasm (smoke)
        run: cargo build --target wasm32-unknown-unknown --release -p fossil-wasm

  deny:
    name: cargo-deny (advisories + licenses + bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "1.90"
