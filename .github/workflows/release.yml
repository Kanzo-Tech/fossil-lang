name: release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write       # npm provenance OIDC (Trusted Publishing)
  contents: write       # Changesets opens + commits the Version Packages PR
  pull-requests: write  # Changesets opens + updates PRs

jobs:
  release:
    runs-on: ubuntu-latest
    # `pnpm -r build` + `-r test` now build the executor (datafusion wasm) +
    # fossil-cli; a COLD run (empty cache) far exceeds 30 min and would be
    # canceled. Generous ceiling; the cargo cache below makes warm runs fast.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Changesets compares against history to compute bumps

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          targets: wasm32-unknown-unknown

      # Cache cargo registry + target — without it every release rebuilds
      # datafusion (executor wasm) + fossil-cli from scratch (~20-40 min).
      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true

      - name: Install wasm-bindgen-cli (exact 0.2.120 per CLAUDE.md stack pins)
        run: cargo install --version 0.2.120 wasm-bindgen-cli

      # datafusion (in @fossil-lang/executor's build:wasm, built by `pnpm -r build`)
      # hardcodes arrow-ipc[zstd]; the wasm32 zstd-sys C build needs a wasm-capable
      # clang. Point cc-rs at ubuntu's LLVM clang for the wasm32 target.
      - name: Install LLVM for wasm zstd-C (@fossil-lang/executor)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang llvm
          echo "CC_wasm32_unknown_unknown=clang" >> "$GITHUB_ENV"
          echo "AR_wasm32_unknown_unknown=llvm-ar" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          # registry-url is REQUIRED for npm Trusted Publishing OIDC to work
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - name: Build WASM artifact (@fossil-lang/wasm)
        run: pnpm --filter @fossil-lang/wasm build:wasm

      - name: Build all packages (recursive)
        run: pnpm -r build

      - name: Test (gate before publishing)
        run: pnpm -r test

      - name: Create Release Pull Request or Publish to npm
        uses: changesets/action@v1
        with:
          # `version` opens the Version Packages PR aggregating accumulated changesets;
          # `publish` runs after that PR merges — invokes pnpm release which calls
          # `changeset publish` with --provenance (set via .changeset/config.json
          # provenance: true). npm Trusted Publishing OIDC uses the id-token: write
          # permission above + the registry-url + provenance flag — NO NPM_TOKEN secret.
          publish: pnpm release
          version: pnpm version
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Auth precedence: if the optional `NPM_TOKEN` secret is set, npm/pnpm
          # authenticate with it; if it's absent, the publish falls back to
          # Trusted Publishing OIDC (id-token: write + registry-url + provenance).
          #
          # BOOTSTRAP (one-time, in CI — no local publish needed): npm OIDC CANNOT
          # create a brand-new package (npmjs.com requires the package to exist
          # before you can attach a Trusted Publisher — verified vs npm docs). So
          # for the FIRST publish, set `NPM_TOKEN` (a Granular Access Token with
          # read+write on @fossil-lang/*) as a repo secret; CI then bootstrap-
          # publishes, creating the packages. Afterwards: configure Trusted
          # Publishers on npmjs.com for each package and DELETE the `NPM_TOKEN`
          # secret — every later release then runs token-less via OIDC.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
