name: release

# TAG-DRIVEN publishing — the git tag IS the version. No changeset commands,
# no Version-Packages PR, no commit pushed back to the repo.
#
# YOUR FLOW:
#   1. push your work to main as usual
#   2. create a tag  →  git tag v0.3.0-alpha.5 && git push --tags
#      (or cut a GitHub Release in the UI — that also creates the tag)
#   3. done. CI stamps that version into every package.json and publishes.
#
# The tag NAME drives both the published version and the npm dist-tag:
#   v0.3.0-alpha.5 → version 0.3.0-alpha.5, dist-tag `alpha`  (does NOT touch `latest`)
#   v0.3.0-rc.0    → version 0.3.0-rc.0,    dist-tag `rc`
#   v0.3.0         → version 0.3.0,         dist-tag `latest`
on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write   # npm provenance / Trusted Publishing OIDC
  contents: read    # nothing is pushed back, no PR is opened — read is enough

jobs:
  release:
    runs-on: ubuntu-latest
    # `pnpm -r build` builds the executor (datafusion wasm) + the rest; a COLD
    # run (empty cache) far exceeds 30 min and would be canceled. Generous
    # ceiling; the cargo cache below makes warm runs fast.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          targets: wasm32-unknown-unknown

      # Cache cargo registry + target — without it every release rebuilds
      # datafusion (executor wasm) + fossil-cli from scratch (~20-40 min).
      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true

      - name: Install wasm-bindgen-cli (exact 0.2.120 per CLAUDE.md stack pins)
        run: cargo install --version 0.2.120 wasm-bindgen-cli

      # datafusion (in @fossil-lang/executor's build:wasm, built by `pnpm -r build`)
      # hardcodes arrow-ipc[zstd]; the wasm32 zstd-sys C build needs a wasm-capable
      # clang. Point cc-rs at ubuntu's LLVM clang for the wasm32 target.
      # LLVM: clang/llvm-ar for the wasm32 zstd-C cross-build (Apple/ubuntu host
      # clang lacks the target). binaryen: `wasm-opt`, which build-wasm.sh runs
      # `-Oz -all` to shrink the executor artefact (~24MB → ~18MB raw / ~6MB gz).
      # WITHOUT binaryen the published wasm ships unoptimised (~2-3× larger).
      - name: Install LLVM + binaryen for the executor wasm (@fossil-lang/executor)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang llvm binaryen
          echo "CC_wasm32_unknown_unknown=clang" >> "$GITHUB_ENV"
          echo "AR_wasm32_unknown_unknown=llvm-ar" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          # registry-url is REQUIRED for npm provenance / Trusted Publishing OIDC
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - name: Build WASM artifact (@fossil-lang/wasm)
        run: pnpm --filter @fossil-lang/wasm build:wasm

      - name: Build all packages (recursive)
        run: pnpm -r build

      # Exclude @fossil-lang/examples — its variations harness builds fossil-cli
      # (datafusion/duckdb, minutes); the dedicated cached `examples.yml` already
      # owns that gate. Same exclusion as pnpm-ci.yml.
      - name: Test (gate before publishing, except examples)
        run: pnpm --filter "!@fossil-lang/examples" -r test

      # The tag (e.g. v0.3.0-alpha.5) is the single source of truth: strip the
      # leading `v` to get the version, and derive the dist-tag from a prerelease
      # identifier if present (alpha/rc/...), else `latest`.
      - name: Resolve version + dist-tag from git tag
        id: rel
        run: |
          ver="${GITHUB_REF_NAME#v}"
          if [[ "$ver" == *-* ]]; then
            tag="$(echo "$ver" | sed -E 's/^[0-9]+\.[0-9]+\.[0-9]+-([0-9A-Za-z]+).*/\1/')"
          else
            tag="latest"
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "→ version=$ver  dist-tag=$tag"

      # Stamp the tag's version into every workspace package.json (ephemeral — in
      # the CI checkout only, never committed back). pnpm rewrites internal
      # `workspace:*` deps to this same version automatically at publish time.
      - name: Stamp version into all packages
        run: pnpm -r exec npm pkg set version="${{ steps.rel.outputs.version }}"

      - name: Publish to npm
        # Idempotent: pnpm publishes only packages whose version isn't on the
        # registry yet, so re-running a tag is safe. access:public comes from each
        # package's publishConfig; --no-git-checks because CI runs on a detached
        # tag ref.
        #
        # NO provenance: npm/sigstore provenance requires a PUBLIC source repo,
        # and Kanzo-Tech/fossil-lang is private (E422 otherwise). When the repo
        # goes public for the OSS launch, re-add `publishConfig.provenance: true`
        # to each package (or pass --provenance here) to attach the attestation.
        run: pnpm -r publish --no-git-checks --tag "${{ steps.rel.outputs.tag }}"
        env:
          # BOOTSTRAP (one-time): npm OIDC/Trusted Publishing cannot create a
          # brand-new package, so the FIRST publish needs `NPM_TOKEN` (a Granular
          # Access Token with read+write on @fossil-lang/*). Afterwards, configure
          # Trusted Publishers on npmjs.com per package and delete the secret.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
