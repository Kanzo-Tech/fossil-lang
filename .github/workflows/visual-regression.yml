# Visual regression gate — Phase 17 plan 17-03 (REL-03 part A).
#
# Runs the Phase 15 `apps/landing/tests/e2e/visual-baselines.spec.ts` 20-cell
# matrix (2 themes × 5 tabs × 2 states) on every PR that touches shared
# library code, the landing app, or the WASM artefact. Hard-blocks on diff
# (per 17-CONTEXT.md: no override-label escape hatch).
#
# # Trigger model (path-filtered, per 17-CONTEXT.md decision)
#
# Fires only on PRs / main-branch pushes that touch:
#   - `packages/**`       — shared @fossil-lang/* library code
#   - `apps/landing/**`   — the canonical demo host (owns the baseline PNGs)
#   - `crates/fossil-wasm/**` — WASM artefact feeds the playground; a Rust
#                               change in tokenizer output WOULD show as a
#                               visual regression in editor highlighting
#   - `.github/workflows/visual-regression.yml` — self-trigger so changes to
#                                                 this workflow are validated
#   - `pnpm-lock.yaml`    — dep bumps may affect rendering
#
# Rust-only PRs (most of `crates/**`), docs (`decisions/**`, root `*.md`),
# and `.planning/**` changes do NOT fire this workflow. Zero compute cost
# on irrelevant PRs.
#
# # Blessing flow (when this workflow fails on a PR)
#
# Per 17-CONTEXT.md decision: local script + commit manual. No GitHub
# Action-triggered or bot-driven blessing. The single mechanism is:
#
#   1. Pull the failing PR locally.
#   2. Run `pnpm bless-baselines` from the repo root.
#   3. Visually inspect the regenerated PNGs under
#      `apps/landing/tests/visual/__snapshots__/`.
#   4. Commit the new baselines as part of the same PR.
#
# # Deliberate-inject smoke test (deferred to 17-05)
#
# To verify the gate fires red on real diffs, 17-05 plans a one-off operator
# verification: modify one CSS color in apps/landing on a draft branch, push,
# confirm this workflow blocks the PR. 17-03 establishes the gate; 17-05
# proves the gate works end-to-end.

name: visual-regression

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'apps/landing/**'
      - 'crates/fossil-wasm/**'
      - '.github/workflows/visual-regression.yml'
      - 'pnpm-lock.yaml'
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'apps/landing/**'
      - 'crates/fossil-wasm/**'
      - '.github/workflows/visual-regression.yml'
      - 'pnpm-lock.yaml'

# Cancel in-progress runs of the same ref when a new push lands.
concurrency:
  group: visual-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-regression:
    runs-on: ubuntu-latest
    # Tighter timeout than playwright.yml's 30 min — this workflow runs
    # ONLY the focused visual-baselines spec subset (20 cells, serial mode),
    # not the full e2e suite.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (for fossil-wasm build)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install wasm-bindgen-cli (exact 0.2.120 per stack pin)
        run: cargo install --version 0.2.120 wasm-bindgen-cli --locked

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Build WASM artefact (fossil-wasm)
        run: pnpm --filter @fossil-lang/wasm build:wasm

      - name: Build all packages + apps
        run: pnpm -r build

      - name: Install Playwright browsers (chromium only — matches Phase 15 baseline matrix)
        run: pnpm --filter @fossil-lang/landing exec playwright install --with-deps chromium

      - name: Visual regression gate (Phase 15 baselines + 17-04 multi-host cells)
        run: |
          pnpm --filter @fossil-lang/landing exec playwright test \
            tests/e2e/visual-baselines.spec.ts
        env:
          CI: '1'

      - name: Upload Playwright HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-report
          path: apps/landing/playwright-report
          retention-days: 7

      - name: Upload diff PNGs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-snapshots
          path: |
            apps/landing/test-results/**/*-actual.png
            apps/landing/test-results/**/*-expected.png
            apps/landing/test-results/**/*-diff.png
          retention-days: 7

      - name: Bless workflow reminder
        if: failure()
        run: |
          echo "::error::Visual baseline diff detected. To bless deliberate visual changes:"
          echo "::error::  1. Pull this PR locally."
          echo "::error::  2. Run \`pnpm bless-baselines\`."
          echo "::error::  3. Visually inspect the regenerated PNGs in apps/landing/tests/visual/__snapshots__/."
          echo "::error::  4. Commit the new baselines as part of this PR."
          echo "::error::  See MIGRATION-v0.2.md or .github/workflows/visual-regression.yml for the full procedure."
