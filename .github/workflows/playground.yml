name: playground

# Path-filtered, and deliberately NOT a step inside `pnpm-ci.yml` — same argument as
# `docs.yml`, with one difference that matters: this app DOES need the Rust toolchain,
# because its three workspace dependencies each shell out to `cargo build --target
# wasm32-unknown-unknown` plus `wasm-bindgen`. So its ceiling is tens of minutes, not the
# fifteen `docs.yml` gets, and hanging it off the shared job would make every crate PR wait
# for a Vite build it cannot break.
#
# `crates/` is in the path filter even though the app compiles no Rust itself: the whole
# point of the app is that it drives `fossil-wasm` and `fossil-df-wasm`, so a change that
# breaks either of their JS surfaces has to turn this red. `examples/` is in it because the
# app imports the walking skeleton directly — changing `hello.fossil` changes what this
# builds.
on:
  pull_request:
    paths:
      - 'apps/playground/**'
      - 'packages/wasm/**'
      - 'packages/executor/**'
      - 'packages/corpus/**'
      - 'packages/types/**'
      - 'crates/**'
      - 'examples/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/playground.yml'
  push:
    branches: [main]
    paths:
      - 'apps/playground/**'
      - 'packages/wasm/**'
      - 'packages/executor/**'
      - 'packages/corpus/**'
      - 'packages/types/**'
      - 'crates/**'
      - 'examples/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/playground.yml'

jobs:
  playground:
    runs-on: ubuntu-latest
    # A cold run compiles datafusion to wasm32, which is the single most expensive thing in
    # this repository's CI. Everything else here is seconds.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          # `rust-toolchain.toml` pins the channel; this only guarantees the target is
          # installed before the first `cargo build --target wasm32-unknown-unknown`.
          toolchain: '1.90'
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: playground-wasm32

      # `fossil-df-wasm`'s `zstd-sys` needs a wasm-capable `clang`, and the runner's default
      # is not one — the failure is `unknown target triple 'wasm32-unknown-unknown'` out of
      # `cc-rs`, and it happens deep in a dependency build where it reads as nonsense.
      # CONTRIBUTING.md carries the same two variables for the local invocation.
      - name: Install wasm-capable LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
          echo "CC_wasm32_unknown_unknown=clang" >> "$GITHUB_ENV"
          echo "AR_wasm32_unknown_unknown=llvm-ar" >> "$GITHUB_ENV"

      # Exact pin: the CLI must match the `wasm-bindgen` lib version in the workspace
      # Cargo.toml or the generated glue is ABI-mismatched against the module it wraps.
      - name: Install wasm-bindgen-cli
        run: cargo install --version 0.2.120 wasm-bindgen-cli --locked

      # binaryen 116, NOT apt's. Ubuntu ships 108, whose wasm-opt corrupts wasm-bindgen's
      # externref table and makes the graph wasm fail to instantiate on Node 20
      # (binaryen #4711). The build scripts skip the optimisation pass rather than fail if
      # wasm-opt is missing, so an install that silently gave us 108 would be worse than none.
      - name: Install wasm-opt
        run: cargo install wasm-opt@0.116.1 --locked

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # `...` on the filter is load-bearing twice: it installs the app's workspace
      # dependencies, and it makes the build below run each one's own `build` first — which
      # is what produces the gitignored `pkg/` directories the app imports `?url` from.
      - name: Install (the playground and its dependencies only)
        run: pnpm install --frozen-lockfile --filter "@fossil-lang/playground..."

      - name: Build (wasm bundles, then the app)
        run: pnpm --filter "@fossil-lang/playground..." build

      # **Node 22, replacing the 20 above, and only from here down.** The verifiers import
      # `apps/playground/src/*.ts` directly under `--experimental-strip-types`, which
      # arrived in 22.6; on 20 the flag is unknown and every one of them fails before it
      # reads a byte. That is how four suites came to be unrunnable in the CI of the repo
      # that owns them. The build above keeps 20 because that is what it has been green on.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Pinned, and for the reason `corpus.yml` pins it: these scripts read Parquet footer
      # statistics, and a silent CLI major should turn a run red on purpose rather than by
      # surprise. `ubuntu-latest` has no duckdb of its own to shadow it.
      - name: Install the duckdb binary
        env:
          DUCKDB_VERSION: v1.5.3
        run: |
          curl -fsSL -o /tmp/duckdb.zip \
            "https://github.com/duckdb/duckdb/releases/download/${DUCKDB_VERSION}/duckdb_cli-linux-amd64.zip"
          unzip -q -o /tmp/duckdb.zip -d /usr/local/bin
          chmod +x /usr/local/bin/duckdb
          duckdb -version

      # ~56 MB, gitignored, generated by the SAME `apps/corpus/guards/fixture.mjs` the
      # corpus guards use rather than a copy. It runs here and not in a job of its own
      # because the verifiers import `@fossil-lang/corpus`, whose barrel reaches the
      # gitignored `pkg/` — so they need the build above, and a second job would have to
      # pay for it again.
      - name: Generate the bench corpus
        run: pnpm --filter "@fossil-lang/playground" bench

      # Absent a corpus every verifier exits 2 and `test` reports a SKIP and stays green,
      # which is right on a laptop and would be a silent pass here. The step above is what
      # makes this one an assertion.
      - name: Verify (tile arithmetic, the canvas source, nesting, the three properties)
        run: pnpm --filter "@fossil-lang/playground" test
