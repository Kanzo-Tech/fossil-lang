[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# The only crate that had no `license` field, so cargo-deny reported it unlicensed while
# every sibling inherited `Apache-2.0 OR MIT`. It is part of the same repo under the same terms.
license.workspace = true
# Unpublished — no crate here has a release channel (release.yml ships only the npm packages/ family), and this is what lets deny.toml's allow-wildcard-paths accept the sibling path deps.
publish = false
description = "Repository automation — run via `cargo xtask <command>`."

[dependencies]
serde_json = { workspace = true }

[dev-dependencies]
# **A DEV-dependency, and the distinction is the whole point.** `cargo xtask
# catalogue` GENERATES `crates/fossil-hir/src/stdlib/generated.rs`. While this
# was a normal dependency, a bad emit stopped `fossil-hir` compiling and
# therefore stopped the tool that fixes it from building — the generator could
# brick itself, and only a hand-edit of a file marked DO NOT EDIT could recover.
#
# Cargo does not build dev-dependencies for a plain `run -p xtask`, so the
# binary now links none of it. The tests still do, which is what keeps the
# round-trip PROVEN rather than assumed: `tests/catalogue_generated.rs` holds
# the emitted table against the `FunctionRegistry` it becomes, and
# `tests/receiver_agrees.rs` derives the receiver rule from `fossil_hir`
# instead of leaving `is_namespace_head` to restate it.
fossil-hir = { path = "../fossil-hir" }
# `tests/engine_reach.rs` reads `deny.toml` — the file that IS the engine-ring
# policy — rather than a second copy of its list, so it needs a TOML parser.
# Declared here and not in `[workspace.dependencies]` for the reason
# `fossil-lsp` declares `criterion` the same way: one crate's test needs it, and
# a workspace row is for a version several crates must agree on. It adds nothing
# to the graph — `toml 0.9.12` was already resolved in `Cargo.lock` before this
# line existed, and no shipped artefact links it, since `xtask` is nobody's
# dependency and this is a dev-dependency of it.
toml = "0.9"
