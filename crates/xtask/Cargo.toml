[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# The only crate that had no `license` field, so cargo-deny reported it unlicensed while
# every sibling inherited `Apache-2.0 OR MIT`. It is part of the same repo under the same terms.
license.workspace = true
# Unpublished — no crate here has a release channel (release.yml ships only the npm packages/ family), and this is what lets deny.toml's allow-wildcard-paths accept the sibling path deps.
publish = false
description = "Repository automation — run via `cargo xtask <command>`."

[dependencies]
serde_json = { workspace = true }
# The stdlib half of the catalogue (ruling 14). `FunctionRegistry` is already a
# table of values, so `cargo xtask catalogue` reads it directly rather than
# parsing the Rust that writes it down.
#
# No cycle, and it is worth saying which direction was checked: nothing depends
# on `xtask` — it is `publish = false`, it is nobody's dependency, and
# `cargo xtask wasm-check` derives its crate set from the cdylib closure, which
# this crate is not in. So `xtask -> fossil-hir` adds an edge to a leaf.
fossil-hir = { path = "../fossil-hir" }
