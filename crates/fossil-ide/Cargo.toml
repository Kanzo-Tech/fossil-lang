[package]
name = "fossil-ide"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Analysis API: hover, goto-def, completion, code actions"
# Unpublished — no crate here has a release channel (release.yml ships only the npm packages/ family), and this is what lets deny.toml's allow-wildcard-paths accept the sibling path deps.
publish = false

[lints]
workspace = true

[dependencies]
# The hover handler needs the Salsa db (fossil-base), the CST +
# SyntaxNode/SyntaxToken (fossil-syntax), Ty + the ty_origin Salsa query
# (fossil-hir), and rowan::TextSize for byte-offset lookups.
fossil-base = { path = "../fossil-base" }
fossil-syntax = { path = "../fossil-syntax" }
fossil-hir = { path = "../fossil-hir" }
# `fossil_mir::program_diagnostics` — the one answer to «what does this file
# report», which the conformance harness also calls. The `diagnostics` module is where
# every editor host asks it, so no host answers it a second way. WASM-clean: the MIR is an operator
# algebra, and the backend that executes one is `fossil-exec`.
fossil-mir = { path = "../fossil-mir" }
# The primitive lattice, for the ONE table that maps a column's `Primitive` to
# the `ScalarTy` the catalogue hangs its members off — `users.name.` offers
# `str.*` because `name` is a `Primitive::STRING`. It is already in the wasm
# closure through fossil-hir, which speaks it too.
fossil-graph-schema = { path = "../fossil-graph-schema" }
# goto-def + completion consume the stdlib classification catalog, which is
# WASM-clean, so fossil-ide stays WASM-clean. Names resolve through
# `fossil_hir::def_map`; this crate keeps no index of its own.
rowan = { workspace = true }
salsa = { workspace = true }
smol_str = { workspace = true }
# `lsp-types` compiles to wasm32-unknown-unknown, which is what lets this crate
# return `lsp_types` structs directly. Had it not, every feature here would have
# had to return Fossil-domain byte-range structs for the host to translate.
# LSP positions are UTF-16; rowan is UTF-8. rust-analyzer's table between them, pure Rust.
line-index = { workspace = true }
# A bare-path key becomes a `file:` URI through the URL Standard's own path
# percent-encoding, not a `format!`. Pure Rust, wasm-clean.
url = { workspace = true }
lsp-types = { workspace = true }
# `DiagnosticData` — what an LSP diagnostic's `data` and a wasm `Diagnostic`
# carry beside the code: a problem's `data` is a `serde_json::Value`.
serde = { workspace = true }
schemars = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# The host with a shape decoder installed, so a test can ask the CHECKER
# whether a registered document reached it.
fossil-base = { path = "../fossil-base", features = ["test-support"] }
# The semantic-tokens + outline golden files in tests/snapshots.
expect-test = { workspace = true }
