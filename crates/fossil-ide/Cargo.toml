[package]
name = "fossil-ide"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Analysis API: hover, goto-def, completion, code actions"

[lints]
workspace = true

[dependencies]
# Plan 02-06 (Phase 2 plan-06): hover handler needs Salsa db (fossil-base),
# CST + SyntaxNode/SyntaxToken (fossil-syntax), Ty + ty_origin Salsa query
# (fossil-hir), and rowan::TextSize for byte-offset lookups.
fossil-base = { path = "../fossil-base" }
fossil-syntax = { path = "../fossil-syntax" }
fossil-hir = { path = "../fossil-hir" }
# Plan 06-06 (SC#4): goto-def + completion consume the cross-file symbol /
# prefix infrastructure (06-03) and the stdlib classification catalog (Phase 5).
# Both are WASM-clean (in / under the 9-crate gate), so fossil-ide stays WASM-clean.
fossil-ide-db = { path = "../fossil-ide-db" }
fossil-registry = { path = "../fossil-registry" }
rowan = { workspace = true }
salsa = { workspace = true }
smol_str = { workspace = true }
# Plan 06-01 Spike A (Research Open Question #3): does `lsp-types` compile to
# wasm32-unknown-unknown? If yes, fossil-ide may return `lsp_types` structs
# directly (recommended downstream API shape); if no, it must return
# Fossil-domain byte-range structs translated in fossil-lsp. Spike outcome
# recorded in 06-01-SUMMARY.md + ADR-0020.
lsp-types = { workspace = true }

[dev-dependencies]
# Plan 06-05 (SC#4): the bidirectional-hover integration test builds a custom
# `HirDb` whose `output_descriptor_kind()` returns a real `ShEx` schema, to
# drive the target-side render path end-to-end (a host-wiring stand-in). Needs
# `OutputDescriptorKind` + `ShExDescriptor`, plus `salsa` for the custom db.
fossil-descriptors-output = { path = "../fossil-descriptors-output" }
# Source-field completion (4th source) test: builds an `InferredDescriptor` and
# registers it on the test `System`, driving the `.<field>` completion path
# end-to-end the way the host (browser DuckDB-WASM / native CLI) would.
fossil-descriptors-input = { path = "../fossil-descriptors-input" }
# Plan 06-07 (SC#4 / SC#5): semantic-tokens + outline snapshot tests render the
# (decoded) token stream / document-symbol tree into a stable, reviewable
# golden file (Research test-map). insta is the workspace snapshot dev-dep.
insta = { workspace = true }
