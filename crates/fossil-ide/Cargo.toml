[package]
name = "fossil-ide"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Analysis API: hover, goto-def, completion, code actions"
# Unpublished — no crate here has a release channel (release.yml ships only the npm packages/ family), and this is what lets deny.toml's allow-wildcard-paths accept the sibling path deps.
publish = false

[lints]
workspace = true

[dependencies]
# The hover handler needs the Salsa db (fossil-base), the CST +
# SyntaxNode/SyntaxToken (fossil-syntax), Ty + the ty_origin Salsa query
# (fossil-hir), and rowan::TextSize for byte-offset lookups.
fossil-base = { path = "../fossil-base" }
fossil-syntax = { path = "../fossil-syntax" }
fossil-hir = { path = "../fossil-hir" }
# The primitive lattice, for the ONE table that maps a column's `Primitive` to
# the `ScalarTy` the catalogue hangs its members off — `users.name.` offers
# `str.*` because `name` is a `Primitive::String`. It was a dev-dependency, and
# it is already in the wasm closure through fossil-hir, which speaks it too.
fossil-graph-schema = { path = "../fossil-graph-schema" }
# goto-def + completion consume the stdlib classification catalog, which is
# WASM-clean, so fossil-ide stays WASM-clean. The cross-file symbol
# infrastructure used to be `fossil-ide-db` and is now the `symbol_index` /
# `workspace` modules here.
rowan = { workspace = true }
salsa = { workspace = true }
smol_str = { workspace = true }
# `lsp-types` compiles to wasm32-unknown-unknown, which is what lets this crate
# return `lsp_types` structs directly. Had it not, every feature here would have
# had to return Fossil-domain byte-range structs for fossil-lsp to translate.
lsp-types = { workspace = true }

[dev-dependencies]
# The host with a shape decoder installed, so `shape_documents`' own tests can
# ask the CHECKER whether the document this host registered reached it — the
# only question that tells a key mismatch apart from a missing document.
fossil-base = { path = "../fossil-base", features = ["test-support"] }
# The completion test's host installs the `SHEX` decoder row on its `System`,
# the way `fossil-lsp` and `fossil-wasm` do — without it a `.shex` the test can
# read is still a document nothing decodes, and the shape-property completions
# quietly disappear.
fossil-descriptors-output = { path = "../fossil-descriptors-output" }
# Source-field completion (4th source) test: builds an `InferredDescriptor` and
# registers it on the test `System`, driving the `.<field>` completion path
# end-to-end the way the host (browser DuckDB-WASM / native CLI) would.
fossil-descriptors-input = { path = "../fossil-descriptors-input" }
# The semantic-tokens + outline snapshot tests render the (decoded) token
# stream / document-symbol tree into a stable, reviewable golden file. insta is
# the workspace snapshot dev-dep.
insta = { workspace = true }
