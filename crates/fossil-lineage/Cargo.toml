[package]
name = "fossil-lineage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Parse-only source lineage + provider introspection, projected onto the host wire types"

[lints]
workspace = true

[dependencies]
# `providers` is a projection of `fossil_hir::stdlib::SOURCE_KINDS` and
# `source_refs` walks the def map — both live in the language crate. This crate
# is the projection ONTO THE WIRE, which is why it is not in `fossil-hir`:
# `fossil-run-status` is the host contract, and ADR-0046 F8 dissolves it into
# the shell. Keeping the edge here means that move takes this crate with it.
fossil-hir = { path = "../fossil-hir" }
fossil-base = { path = "../fossil-base" }
fossil-run-status = { path = "../fossil-run-status" }
