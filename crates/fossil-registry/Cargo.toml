[package]
name = "fossil-registry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Stdlib function registry (pure-SQL vs native-UDF classification)"

[lints]
workspace = true

[dependencies]
# Phase 5 STDL-01..07: the registry now carries function signatures + lowering
# classification. fossil-hir supplies the Ty/FnSig ADT (Phase 2 ty.rs) so a
# registry entry can materialize a real interned `FnSig<'db>` on demand.
# fossil-hir is already WASM-clean, so the WASM gate stays green (no leak).
fossil-hir = { path = "../fossil-hir" }
# `lineage.rs` (ADR-0045 §4): `providers` projects SOURCE_KINDS and `source_refs`
# walks the def map, both into the CLI/browser wire types. WASM-clean — the wire
# crate is serde + schemars only, and `fossil-base` is already transitive here.
fossil-base = { path = "../fossil-base" }
fossil-run-status = { path = "../fossil-run-status" }
salsa = { workspace = true }
smol_str = { workspace = true }
