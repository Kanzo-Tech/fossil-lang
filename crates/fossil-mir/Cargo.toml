[package]
name = "fossil-mir"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Mid-level IR: typed operator algebra (Source, Project, Filter, Join, ...)"

[lints]
workspace = true

[dependencies]
fossil-base     = { path = "../fossil-base" }
fossil-syntax   = { path = "../fossil-syntax" }
fossil-hir      = { path = "../fossil-hir" }
# W1: source dispatch reads the single SOURCE_KINDS table (acyclic — registry's
# dep closure is hir/base/syntax/descriptors/shex, none of which is fossil-mir).
# The output descriptor (ShEx) drives the property-graph edge/cardinality
# classification in `apply_output_shape` — passed as a function argument
# (ADR-0018: NEVER read through `Db::system()`), so this is a plain data dep, not
# a Salsa input. Acyclic: descriptors-output's closure is shex/base, not mir.
fossil-descriptors-output = { path = "../fossil-descriptors-output" }
# The canonical output model `apply_output_shape` classifies against (the
# descriptor lowers to it, regardless of source schema language).
fossil-graph-schema = { path = "../fossil-graph-schema" }
salsa           = { workspace = true }
smol_str        = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
