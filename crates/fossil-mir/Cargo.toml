[package]
name = "fossil-mir"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Mid-level IR: typed operator algebra (Source, Project, Filter, Join, ...)"
# Unpublished — no crate here has a release channel (release.yml ships only the npm packages/ family), and this is what lets deny.toml's allow-wildcard-paths accept the sibling path deps.
publish = false

[lints]
workspace = true

[dependencies]
fossil-base     = { path = "../fossil-base" }
fossil-syntax   = { path = "../fossil-syntax" }
# W1: source dispatch reads the single `stdlib::n` table that lives here.
fossil-hir      = { path = "../fossil-hir" }
# The canonical, format-neutral model `apply_output_shape` classifies against —
# and the ONLY schema dependency the middle of the compiler has. It is passed as
# a function argument, NEVER read through `Db::system()`, so this is a
# plain data dep, not a Salsa input. No schema-language crate belongs here:
# whichever document (ShEx, SHACL, accept-all) produced the schema is the caller's
# business, and depending on one would drag ShEx into a crate that never names it.
fossil-graph-schema = { path = "../fossil-graph-schema" }
salsa           = { workspace = true }
smol_str        = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
# The host with a shape decoder installed. A DEV-dependency on a DEV-only
# feature of a crate this one already depends on — NOT a new crate in the graph,
# and above all not `fossil-shex` or `fossil-descriptors-output`, which `0e6898d`
# cut out of here on purpose. The decoder reads a three-token line format with no
# schema language behind it, so a test can resolve a shape without this crate
# learning that ShEx exists.
fossil-base = { path = "../fossil-base", features = ["test-support"] }
