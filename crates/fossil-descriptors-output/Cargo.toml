[package]
name = "fossil-descriptors-output"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Output descriptors (ShEx via rudof, future SHACL) for backward shape checking"

[lints]
workspace = true

[dependencies]
# The ShEx decode (parse + resolved constraint table) was extracted to the
# neutral `fossil-shex` crate so the INPUT descriptor can derive source column
# types from the same table (compile-time, always). This crate re-exports those
# types for its existing public API; the rudof crates are now transitive via
# fossil-shex. shex_validation stays out — AST-only here (per rudof-wasm.md).
#
# Note: do NOT add a `fossil-hir` path dep here. `ShapeId` mapping lives in
# fossil-hir's `shapes.rs` (plan 03-05); the kind enum here carries only the
# `fossil-shex` resolved-table types.
fossil-shex = { path = "../fossil-shex" }
# The canonical, format-neutral output model the executor consumes. ShEx lowers
# into it (`ShExDescriptor::to_graph_schema`); SHACL produces it pre-lowered.
fossil-graph-schema = { path = "../fossil-graph-schema" }

# Plan 03-03 Task 2 step 3 (Option B mandate — cycle-safe): the
# `SystemWithDescriptors` extension trait depends on `fossil_base::System`.
# The natural dependency direction is `fossil-descriptors-output ->
# fossil-base` (descriptors are a concrete impl of base abstractions). We
# do NOT invert this by putting the descriptor accessor on
# `fossil-base::System`. See ADR-0006.
fossil-base = { path = "../fossil-base" }
