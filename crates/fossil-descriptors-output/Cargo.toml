[package]
name = "fossil-descriptors-output"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Output descriptors (ShEx via rudof, future SHACL) for backward shape checking"

[lints]
workspace = true

[dependencies]
# Phase 3 CORE-06: rudof crates per workspace-level inheritance + the
# Phase 0 spike outcome in `decisions/rudof-wasm.md` (Path (a) Clean WASM).
# shex_validation is intentionally NOT included — Phase 3 walks the AST only
# (no runtime ShEx validation), per 03-RESEARCH.md §"Standard Stack".
#
# Note: do NOT add a `fossil-hir` path dep here. `ShapeId` mapping lives in
# fossil-hir's `shapes.rs` (plan 03-05); the kind enum here carries only
# `shex_ast::Schema` + lightweight resolved-table structs local to this crate.
# Plan 03-03 Task 2 step 3 adds `fossil-base = { path = "../fossil-base" }`
# (for the `SystemWithDescriptors` extension trait) — that addition is
# owned by plan 03-03, not this plan.
shex_ast = { workspace = true }
rudof_iri = { workspace = true }
prefixmap = { workspace = true }

# Plan 03-03 Task 2 step 3 (Option B mandate — cycle-safe): the
# `SystemWithDescriptors` extension trait depends on `fossil_base::System`.
# The natural dependency direction is `fossil-descriptors-output ->
# fossil-base` (descriptors are a concrete impl of base abstractions). We
# do NOT invert this by putting the descriptor accessor on
# `fossil-base::System`. See ADR-0006.
fossil-base = { path = "../fossil-base" }
