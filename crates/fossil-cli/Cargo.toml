[package]
name = "fossil-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "`fossil compile/check/run` command-line interface — a thin shell over fossil-engine"
# Unpublished — no crate here has a release channel (release.yml ships only the npm packages/ family), and this is what lets deny.toml's allow-wildcard-paths accept the sibling path deps.
publish = false

[lints]
workspace = true

[dependencies]
# All orchestration lives in the engine; the binary is a thin CLI + presentation shell.
fossil-engine = { path = "../fossil-engine" }
# The host half: DESCRIBE each source before the compile, and hold the
# credentials that let it. See its module doc for why it is not in the engine.
fossil-introspect = { path = "../fossil-introspect" }
# `Diagnostic` / `Severity` for rustc-style `check` rendering.
fossil-base       = { path = "../fossil-base" }
# `RunReport` — the shape `run` prints, named where it is produced. The binary
# already links this crate through the engine; what it adds here is the name.
# (`refs` and `providers` print `Vec`s the engine hands back and this file never
# names, so `fossil-lineage` is not an edge.)
fossil-df         = { path = "../fossil-df" }
# Machine JSON on stdout (`--output-json`) for keasy subprocess consumption.
serde_json = { workspace = true }

clap = { workspace = true }
# `fancy` ONLY in this crate: pulls native-only `terminal_size` + `supports-color`.
# fossil-cli is NATIVE-ONLY (cfg-tripwire), so the leak is contained.
miette = { workspace = true, features = ["fancy", "derive"] }
# CLI-02: `CheckError` / `CheckReport` derive `thiserror::Error` alongside `miette::Diagnostic`.
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# Integration tests drive the `fossil` binary as a black box, then read the
# produced parquet back + assert registry invariants. These crates are TEST-ONLY
# (the binary itself links none of them — they live in fossil-engine now).
insta = { workspace = true }
duckdb = { workspace = true }
fossil-layout       = { path = "../fossil-layout" }
# `--output-json` prints the manifest, and `run_w0b.rs` reads the YAML document
# the same run wrote to disk and compares the two values. Without this the test
# could only compare strings it built itself, which is the drift it is there to
# catch.
serde_yaml_ng = { workspace = true }

[[bin]]
name = "fossil"
path = "src/main.rs"
