[package]
name = "fossil-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "`fossil compile/check/run` command-line interface"

[lints]
workspace = true

[dependencies]
fossil-base    = { path = "../fossil-base" }
fossil-hir     = { path = "../fossil-hir" }
fossil-codegen = { path = "../fossil-codegen" }
fossil-runtime = { path = "../fossil-runtime" }

clap = { workspace = true }
# `fancy` ONLY in this crate (not workspace-level): pulls native-only
# `terminal_size` + `supports-color` which would break the WASM gate per
# RESEARCH.md Pitfall 3. fossil-cli is NATIVE-ONLY (cfg-tripwire below), so
# the leak is contained.
miette = { workspace = true, features = ["fancy"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# Integration test reads the produced parquet to assert 5-row count.
# Cargo dedupes against fossil-runtime's bundled DuckDB (~80MB C++) so the
# build cost is incurred once across both crates — acceptable for native CI.
duckdb = { workspace = true }

[[bin]]
name = "fossil"
path = "src/main.rs"
