[package]
name = "fossil-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "`fossil compile/check/run` command-line interface"

[lints]
workspace = true

[dependencies]
fossil-base    = { path = "../fossil-base" }
fossil-hir     = { path = "../fossil-hir" }
fossil-codegen = { path = "../fossil-codegen" }
fossil-runtime = { path = "../fossil-runtime" }
# Plan 03-03 Task 2 step 5: CLI host wires `SystemWithDescriptors` impl on
# its concrete `CliSystem` struct. Default `output_descriptor_kind()`
# returns AcceptAll for Phase 3 v0.1; Phase 6 LSP-01 will override here.
fossil-descriptors-output = { path = "../fossil-descriptors-output" }
# Phase 13 INPUT-01 / plan 13-04a: native CLI pre-introspects io.csv("...")
# source bindings via DuckDB DESCRIBE + registers InferredDescriptor on the
# CliSystem ahead of typecheck. ADR-0037.
fossil-descriptors-input = { path = "../fossil-descriptors-input" }
smol_str = { workspace = true }
regex = { workspace = true }

# W0b/6: the `fossil run --dest <url>` path uses the W0b writer +
# materializer instead of the legacy flat-COPY chain.
fossil-sinks    = { path = "../fossil-sinks" }
fossil-resolver = { path = "../fossil-resolver" }
fossil-mir      = { path = "../fossil-mir" }
# Status JSON on stdout (via --output-json) for keasy subprocess consumption.
serde_json = { workspace = true }
# `--creds-stdin`: deserialize the cloud-config payload (DuckDB SET keys →
# SecretString values) a multi-tenant host pipes in. serde derive for the wire
# structs; secrecy keeps the values off Debug/argv/env.
serde = { workspace = true, features = ["derive"] }
secrecy = { workspace = true }

clap = { workspace = true }
# `fancy` ONLY in this crate (not workspace-level): pulls native-only
# `terminal_size` + `supports-color` which would break the WASM gate per
# RESEARCH.md Pitfall 3. fossil-cli is NATIVE-ONLY (cfg-tripwire below), so
# the leak is contained.
miette = { workspace = true, features = ["fancy", "derive"] }
# CLI-02: the `CheckError` / `CheckReport` reports derive `thiserror::Error`
# alongside `miette::Diagnostic` (the recommended miette derive shape).
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# CLI-03 result summary: `fossil run` reads the produced Parquet back through a
# DuckDB count query (RESEARCH Pitfall 6). Cargo dedupes against
# fossil-runtime's bundled DuckDB so the build cost is incurred once.
duckdb = { workspace = true }

[dev-dependencies]
# Integration tests read produced parquet + snapshot rendered diagnostics.
insta = { workspace = true }

[[bin]]
name = "fossil"
path = "src/main.rs"
