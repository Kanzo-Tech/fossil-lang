[package]
name = "fossil-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "`fossil compile/check/run` command-line interface"

[lints]
workspace = true

[dependencies]
fossil-base    = { path = "../fossil-base" }
fossil-hir     = { path = "../fossil-hir" }
fossil-codegen = { path = "../fossil-codegen" }
fossil-runtime = { path = "../fossil-runtime" }
# Plan 03-03 Task 2 step 5: CLI host wires `SystemWithDescriptors` impl on
# its concrete `CliSystem` struct. Default `output_descriptor_kind()`
# returns AcceptAll for Phase 3 v0.1; Phase 6 LSP-01 will override here.
fossil-descriptors-output = { path = "../fossil-descriptors-output" }

clap = { workspace = true }
# `fancy` ONLY in this crate (not workspace-level): pulls native-only
# `terminal_size` + `supports-color` which would break the WASM gate per
# RESEARCH.md Pitfall 3. fossil-cli is NATIVE-ONLY (cfg-tripwire below), so
# the leak is contained.
miette = { workspace = true, features = ["fancy", "derive"] }
# CLI-02: the `CheckError` / `CheckReport` reports derive `thiserror::Error`
# alongside `miette::Diagnostic` (the recommended miette derive shape).
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# CLI-03 result summary: `fossil run` reads the produced Parquet back through a
# DuckDB count query (RESEARCH Pitfall 6). Cargo dedupes against
# fossil-runtime's bundled DuckDB so the build cost is incurred once.
duckdb = { workspace = true }

[dev-dependencies]
# Integration tests read produced parquet + snapshot rendered diagnostics.
insta = { workspace = true }

[[bin]]
name = "fossil"
path = "src/main.rs"
