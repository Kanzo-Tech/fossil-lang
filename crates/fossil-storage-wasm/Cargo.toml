[package]
name = "fossil-storage-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "wasm-bindgen binding for fossil-storage — the WASM core of @fossil-lang/storage."
# Unpublished — no crate here has a release channel (release.yml ships only the npm packages/ family), and this is what lets deny.toml's allow-wildcard-paths accept the sibling path deps.
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
fossil-storage = { path = "../fossil-storage", features = ["js"] }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
serde-wasm-bindgen = { workspace = true }
serde = { workspace = true }
js-sys = { workspace = true }
# `object_store` signs with `chrono::Utc::now()`, which falls through to std's
# `SystemTime::now()` — a panic on wasm32 — unless `wasmbind` is on.
chrono = { version = "0.4", default-features = false, features = ["clock", "wasmbind"] }
# `object_store` draws randomness through two lines of getrandom — 0.2 from
# `ring`, 0.4 from `rand` — and neither builds for wasm32 without its JS backend.
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
