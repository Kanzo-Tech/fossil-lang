[package]
name = "fossil-storage-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "wasm-bindgen binding for fossil-storage — the WASM core of @fossil-lang/storage."
# Unpublished — no crate here has a release channel (release.yml ships only the npm packages/ family), and this is what lets deny.toml's allow-wildcard-paths accept the sibling path deps.
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
fossil-storage = { path = "../fossil-storage", features = ["js"] }
# Every value this crate throws or answers as a failure is built by
# `fossil_graph_schema::js` — the one boundary function the wasm crates share.
fossil-graph-schema = { path = "../fossil-graph-schema", features = ["js"] }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
serde-wasm-bindgen = { workspace = true }
serde = { workspace = true }
js-sys = { workspace = true }
# A panic is still a `RuntimeError: unreachable` — it is not a value that can be
# built as it happens — but with the hook its message and trace reach the console.
console_error_panic_hook = { workspace = true }
# `wasmbind` — the workspace entry says why.
chrono = { workspace = true }
# `object_store` draws randomness through two lines of getrandom — 0.2 from
# `ring`, 0.4 from `rand` — and neither builds for wasm32 without its JS backend.
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
