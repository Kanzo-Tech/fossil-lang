[package]
name = "fossil-lsp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Language Server Protocol binary over lsp-server (stdio, native-only)"

[lints]
workspace = true

[[bin]]
name = "fossil-lsp"
path = "src/main.rs"

[dependencies]
# Phase 1 LSP scope (per ADR-0001, NOT tower-lsp): wired the LSP transport from
# day 1 (no fase-4 trap) but shipped zero compiler features. Phase 2 plan 02-06
# adds fossil-base + fossil-ide for the minimum hover delta. Phase 6 LSP-01
# grows the full provider surface.
fossil-base        = { path = "../fossil-base" }
fossil-ide         = { path = "../fossil-ide" }
lsp-server         = { workspace = true }
lsp-types          = { workspace = true }
crossbeam-channel  = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
