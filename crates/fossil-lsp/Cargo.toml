[package]
name = "fossil-lsp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Language Server Protocol binary over lsp-server (stdio, native-only)"

[lints]
workspace = true

[[bin]]
name = "fossil-lsp"
path = "src/main.rs"

[dependencies]
# Phase 1 LSP scope (per ADR-0001, NOT tower-lsp): wired the LSP transport from
# day 1 (no fase-4 trap) but shipped zero compiler features. Phase 2 plan 02-06
# adds fossil-base + fossil-ide for the minimum hover delta. Phase 6 LSP-01
# grows the full provider surface.
fossil-base        = { path = "../fossil-base" }
fossil-ide         = { path = "../fossil-ide" }
lsp-server         = { workspace = true }
lsp-types          = { workspace = true }
crossbeam-channel  = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# Plan 03-07 (SC#3 / CORE-07): the lsp_hover_smoke integration test drives
# implicit-closure synthesis + CSVW forward propagation IN-PROCESS (via
# fossil-hir's Checker + fossil-descriptors-input's CSVW descriptor) and
# asserts on fossil_ide::hover::render_markdown — the exact rendering surface
# the LSP hover handler invokes. The full JSON-RPC end-to-end SC#3 surface
# form is deferred to Phase 6 (Phase 3 v0.1 has no seq.filter / pipeline
# surface syntax to trigger synthesis — plan 03-05 decision: NO seq.filter
# stub). serde_json is the existing JSON-RPC smoke-test dep (declared above
# as a normal dependency — also used by the smoke test).
fossil-hir               = { path = "../fossil-hir" }
fossil-descriptors-input = { path = "../fossil-descriptors-input" }
smol_str                 = { workspace = true }
