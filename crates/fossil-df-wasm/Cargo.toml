# fossil-df-wasm — wasm-bindgen wrapper exposing the DataFusion executor
# (`fossil-df`) to JS. Kept SEPARATE from `fossil-wasm` (the LSP shim) so the
# editor's wasm stays lean and loads on page-load, while this heavy executor is
# lazy-loaded only when a job runs.
[package]
name = "fossil-df-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "WASM wrapper for the fossil DataFusion executor — runs mappings in the browser"
# Unpublished — no crate here has a release channel (release.yml ships only the npm packages/ family), and this is what lets deny.toml's allow-wildcard-paths accept the sibling path deps.
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[lints]
workspace = true

[dependencies]
# The executor itself (lower_to_mir_pg → DataFusion → GraphArData → to_files).
fossil-df = { path = "../fossil-df" }
# The layout pass — Louvain communities and the Hilbert renumbering — run here,
# in memory, after `execute_graph`. It is the same crate and the same entry
# point the native host calls, driven through `fossil_layout::io::MemoryFs`
# because a browser has no filesystem. Without this edge the tab wrote the
# STAGED tree against a manifest declaring the TILED one, with `x`/`y`/
# `cluster_id` at the writer's zeros — a corpus satisfying the manifest's shape
# and violating the addressing property that shape exists to express.
#
# It costs the wasm bundle nothing it was not already paying: the crate declares
# `[package.metadata.fossil] wasm = true`, and everything it links — DataFusion
# included, which it takes transitively through `fossil-df` — is what the line
# above already brings.
fossil-layout = { path = "../fossil-layout" }
# One name — `manifest::DEFAULT_CHUNK_SIZE` — so the tile size this pass emits
# at and the tile size the manifest declares are one constant, as they are on
# the native side.
fossil-sinks = { path = "../fossil-sinks" }
# FossilDb (production salsa db) + SourceFile + the System trait + the document
# registry the host fills.
fossil-base = { path = "../fossil-base" }
# The type-reading provider rows `ExecutorSystem` installs, and the
# `OutputDescriptorKind` `fossil_df::output_descriptor` hands back.
fossil-descriptors-output = { path = "../fossil-descriptors-output" }
# `documents::missing_documents` — which documents the program names and does
# not hold, keyed and located by the one rule the checker uses.
fossil-hir = { path = "../fossil-hir" }

# DataFusion (match fossil-df: no `sql` frontend, keep `parquet` reads). The
# wasm host owns the SessionContext so it can register source object stores +
# tune execution (target_partitions = 1 — single-thread, no tokio::spawn).
datafusion = { version = "54", default-features = false, features = ["parquet"] }
# Every byte of a run goes through `fossil-storage`'s `Storage` — stores built
# from the credentials the JS `Host` vends, or `InMemory` for a host with no
# storage — and `DataFusion` reads sources through the same stores.
fossil-storage = { path = "../fossil-storage", features = ["js"] }
object_store = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
url = "2"
# chrono is transitive (datafusion / object_store) and pulled with wasmbind OFF,
# so `Utc::now()` falls through to std `SystemTime::now()` — which PANICS on
# wasm32 ("time not implemented"). object_store stamps `InMemory::put` and signs
# every S3 request with `Utc::now()`, so the executor hits it. Adding chrono directly
# with `wasmbind` flips the feature on for the whole graph (js_sys::Date clock,
# works in browser + node; target-gated to wasm32 → no-op on native).
chrono = { version = "0.4", features = ["wasmbind"] }

# WASM glue — wasm-bindgen exact-pinned at workspace level (=0.2.120) to match
# the wasm-bindgen-cli version exactly. `run()` is async, so
# wasm-bindgen-futures bridges the Rust future to a JS Promise.
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
serde-wasm-bindgen = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
js-sys = { workspace = true }
console_error_panic_hook = { workspace = true }

# Transitive WASM enablers — keep as direct deps so feature resolution sticks.
# The `wasm_js` backend is what lets getrandom build for wasm32 at all, and who
# needs it is DataFusion, not salsa: `cargo tree -p fossil-df-wasm -i
# getrandom@0.3.4 --target wasm32-unknown-unknown` arrives through `rand` ←
# `datafusion-datasource`, and getrandom 0.2 through `const-random` ← `ahash` ←
# `arrow`. Salsa's own hashbrown hashes with foldhash and draws no randomness.
getrandom = { workspace = true }
# `object_store`'s cloud client adds two more lines: 0.2 from `ring`, 0.4 from `rand`.
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
futures = { workspace = true }
# Native test drives the async core on a real runtime (the browser uses JS's
# event loop instead, so tokio never reaches the wasm build).
tokio = { workspace = true }
fossil-base = { path = "../fossil-base" }
