[package]
name = "fossil-syntax"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Lossless concrete syntax tree for the Fossil DSL (rowan + logos)"
# Unpublished — no crate here has a release channel (release.yml ships only the npm packages/ family), and this is what lets deny.toml's allow-wildcard-paths accept the sibling path deps.
publish = false

[lints]
workspace = true

[dependencies]
fossil-base = { path = "../fossil-base" }
salsa = { workspace = true }
rowan = { workspace = true }
logos = { workspace = true }
text-size = { workspace = true }
smol_str = { workspace = true }

[dev-dependencies]
expect-test = { workspace = true }
