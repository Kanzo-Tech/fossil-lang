# The canonical graph-schema — the shared contract of the universal substrate,
# and the point the whole design is most sensitive to: change this and every
# side changes. A property graph is a SCHEMA over typed relations (SQL/PGQ: keys +
# references); this crate is that schema, format-neutral. It depends on serde and
# the error crates below and nothing else, so EVERY side (producer fossil-df, materializers, the manifest writer,
# the wire) can speak it without pulling the ShEx/Arrow machinery — that
# decoupling is what keeps the substrate modifiable.
#
# It is also where the error catalogue lives (`problem`): `Problem` and
# `Failure` are vocabulary every raising crate shares, so this leaf gained the
# three crates an error needs — `thiserror` for the message, `schemars` for the
# schema the TypeScript union is generated from, and `miette` (no default
# features: the trait, no renderer) so a failure renders with its code. All
# three are wasm-clean; none brings Arrow or ShEx.
#
# The `js` feature is the boundary: `problem::js::to_js`, the ONE function that
# turns a `Failure` into the JavaScript `FossilError` every wasm crate throws.
# It adds `wasm-bindgen`, `js-sys` and `serde_json` (the wire object is built
# by serialising and `JSON.parse`), all optional, so a crate that only raises
# stays serde + the error crates. Its `to_js` calls wasm-bindgen intrinsics,
# which panic on a native target: native tests keep to the pure-Rust half.
[package]
name = "fossil-graph-schema"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Canonical property-graph schema (SQL/PGQ keys + references) — the universal-substrate contract"
# Unpublished — no crate here has a release channel (release.yml ships only the npm packages/ family), and this is what lets deny.toml's allow-wildcard-paths accept the sibling path deps.
publish = false

[lib]
doctest = false

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
schemars = { workspace = true }
miette = { workspace = true }
wasm-bindgen = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[features]
js = ["dep:wasm-bindgen", "dep:js-sys", "dep:serde_json"]

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
