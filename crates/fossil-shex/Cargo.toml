[package]
name = "fossil-shex"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "ShEx schema resolution (rudof) — the shared decode behind Fossil's input + output descriptors"
# Unpublished — no crate here has a release channel (release.yml ships only the npm packages/ family), and this is what lets deny.toml's allow-wildcard-paths accept the sibling path deps.
publish = false

[lints]
workspace = true

[dependencies]
# rudof crates per workspace inheritance, on the WASM-clean path proved by the
# Phase 0 spike. This crate is the neutral
# home for the ShEx → resolved-constraint-table decode: the OUTPUT descriptor
# consumes it for backward shape checking, the INPUT descriptor consumes the
# same table to derive source column types (compile-time, always). AST-only —
# no runtime ShEx validation here.
shex_ast = { workspace = true }
rudof_iri = { workspace = true }
prefixmap = { workspace = true }
# The canonical, format-neutral output model both ShEx and SHACL lower into.
fossil-graph-schema = { path = "../fossil-graph-schema" }
