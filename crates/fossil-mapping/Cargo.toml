[package]
name = "fossil-mapping"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "A mapping as data — RML's triples maps, every name a column or a shape's — and the Fossil program emitted from it."
# Unpublished — no crate here has a release channel (release.yml ships only the npm packages/ family), and this is what lets deny.toml's allow-wildcard-paths accept the sibling path deps.
publish = false

[lints]
workspace = true

[dependencies]
# The spec is what a model fills under a JSON Schema and what a host sends
# across `wasm-bindgen`: serde for the value, schemars for its schema.
serde = { workspace = true }
schemars = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# The round trips read their specs as a host sends them: JSON.
serde_json = { workspace = true }
