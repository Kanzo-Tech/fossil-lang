[package]
name = "fossil-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "WASM shim for the Fossil compiler — exposes FossilPlayground to JS"
# Unpublished — no crate here has a release channel (release.yml ships only the npm packages/ family), and this is what lets deny.toml's allow-wildcard-paths accept the sibling path deps.
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false
test = false

[lints]
workspace = true

[dependencies]
# Compiler-core crates wired into FossilPlayground::compile
# The wasm dep tree is the compiler front-end crates plus WASM glue. NO
# fossil-layout (the write path's post-pass), NO fossil-cli/fossil-lsp (binaries), NO
# fossil-sinks/fossil-codegen (the SQL/GraphAr backend — the browser does not
# compile to SQL anymore; the editor is LSP-only).
fossil-base    = { path = "../fossil-base" }
fossil-syntax  = { path = "../fossil-syntax" }
fossil-hir     = { path = "../fossil-hir" }
fossil-mir     = { path = "../fossil-mir" }
# WasmSystem stores InferredDescriptors registered
# by the browser-side playground orchestration BEFORE invoking compile() — the
# Rust forward-propagation path reads them through the System trait accessor,
# because the browser has no filesystem to introspect a CSV from.
fossil-descriptors-input = { path = "../fossil-descriptors-input" }
# The `SHEX` decoder row this host installs on its `System`. A table of `fn`
# so the dependency buys one const and no vtable — and the
# playground never names a ShEx type: it hands the row over and the compiler
# calls it.
fossil-descriptors-output = { path = "../fossil-descriptors-output" }
smol_str = { workspace = true }
# `fossil_lineage::source_refs` is what the test-reachable `refs_native` core
# calls to report a program's source bindings. WASM-clean: its own deps are
# fossil-hir + salsa + smol_str, all already inside the WASM gate, and it pulls
# NEITHER fossil-layout NOR any native UDF crate.
fossil-lineage = { path = "../fossil-lineage" }
# The `check()` method converts byte-offset spans to UTF-16 LSP ranges via
# `fossil_ide::LineIndex` (the rust-analyzer model). fossil-ide is inside the
# WASM gate — wasm32-clean by construction. Wiring this dep lets `check()`
# return the same range shape the LSP Worker republishes verbatim.
fossil-ide = { path = "../fossil-ide" }
# `WasmDb` is a fresh `#[salsa::db]` struct (mirrors `LspDb` — production hosts
# own their own db). Needs the
# `salsa::Storage<Self>` field + the `Database` derive macro at the
# trait-object level.
salsa = { workspace = true }

# The WASM LSP transport speaks raw LSP
# JSON-RPC over `postMessage` to a Web Worker. lsp-types gives us the typed
# request / notification params + capability surface (mirrors fossil-lsp 1:1);
# web-sys gives us the `DedicatedWorkerGlobalScope.onmessage` hook the
# `start_lsp_worker` entrypoint installs. Both are wasm32-clean (lsp-types
# proven by the WASM gate; web-sys is the canonical
# JsCast-able binding crate). No tokio, no mio.
lsp-types = { workspace = true }
web-sys = { workspace = true, features = ["MessageEvent", "DedicatedWorkerGlobalScope"] }

# WASM glue — wasm-bindgen exact-pinned at workspace level (=0.2.120) per
# The lib version MUST match the wasm-bindgen-cli
# version installed locally / in CI.
wasm-bindgen             = { workspace = true }
serde-wasm-bindgen       = { workspace = true }
serde                    = { workspace = true }
serde_json               = { workspace = true }
js-sys                   = { workspace = true }
console_error_panic_hook = { workspace = true }

# Transitive WASM enablers — keep as direct deps so feature resolution sticks.
# The `wasm_js` feature is what lets getrandom build for wasm32 at all, and who
# needs it is the rudof/ShEx stack, not salsa: `cargo tree -p fossil-wasm -i
# getrandom@0.3.4 --target wasm32-unknown-unknown` arrives through `rand` ←
# `oxrdf` ← `oxrdfio` ← `rudof_rdf` ← `shex_ast`. Salsa's own hashbrown hashes
# with foldhash and draws no randomness. The line here used to say
# salsa→hashbrown→ahash, until the tree above was read. The `.cargo/config.toml`
# rustflag is the belt-and-suspenders fallback for unconditioned call sites.
getrandom = { workspace = true }
uuid      = { workspace = true }

[dev-dependencies]
# The lattice the descriptor JSON carries.
fossil-graph-schema = { path = "../fossil-graph-schema" }
wasm-bindgen-test.workspace = true
