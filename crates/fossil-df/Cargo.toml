# DataFusion backend for the property-graph MIR (paso 3 — arranque vertex-only).
# Nativo por ahora: default features (read_csv etc.); el zstd-C solo falla a
# wasm32 — el recorte de features para wasm es un incremento posterior.
[package]
name = "fossil-df"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "DataFusion backend for the property-graph MIR (lower_to_mir_pg)"
publish = false

[lib]
doctest = false

[dependencies]
fossil-base = { path = "../fossil-base" }
fossil-hir = { path = "../fossil-hir" }
fossil-mir = { path = "../fossil-mir" }
# Manifest structs (GraphInfo/VertexInfo/EdgeInfo + data_type_name) and the
# host↔fossil wire contract (RunStatus). Both WASM-clean (arrow-schema / serde
# only) — the backend reuses them instead of re-deriving the GraphAr layout.
fossil-sinks = { path = "../fossil-sinks" }
fossil-run-status = { path = "../fossil-run-status" }
serde_yaml_ng = { workspace = true }
# `default-features = false` drops datafusion's `sql` frontend (we build plans
# via the DataFrame/LogicalPlan API, not `ctx.sql()`), `parquet` (Parquet bytes
# are written by parquet-wasm in JS, not here) and datafusion's own
# `compression` feature — shrinking the wasm surface. CSV reading stays (core,
# ungated). Re-add a feature here if a plan operator needs it.
#
# ⚠️ This does NOT remove the `zstd` C dep: datafusion 54 HARDCODES
# `arrow-ipc` with `features=["lz4","zstd"]` in datafusion-common /
# datafusion-datasource-arrow / datafusion-physical-plan (not behind any
# feature). So `zstd-sys` cannot be cut from the feature graph — the wasm32
# build needs a wasm-capable clang to compile zstd-C (verified 2026-06-09):
#   CC_wasm32_unknown_unknown=<llvm>/clang AR_wasm32_unknown_unknown=<llvm>/llvm-ar \
#     cargo build -p fossil-df --target wasm32-unknown-unknown
# (Apple's system clang lacks the wasm target; `brew install llvm` provides one.)
# Cutting zstd entirely would require a `[patch.crates-io]` fork of those three
# subcrates — deferred. The wasm CI job must install LLVM.
datafusion = { version = "54", default-features = false }

[dev-dependencies]
tokio = { workspace = true }
fossil-base = { path = "../fossil-base" }
fossil-hir = { path = "../fossil-hir" }
