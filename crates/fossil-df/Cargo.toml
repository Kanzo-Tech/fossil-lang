# DataFusion backend for the property-graph MIR: lowers `lower_to_mir_pg` to a
# DataFusion plan, executes it, and writes the `fossil/1` corpus through
# `Storage` — `Executor` is the one host that writes one. Compiles to wasm32
# (the browser executor) and natively (the tests) alike.
[package]
name = "fossil-df"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "DataFusion backend for the property-graph MIR (lower_to_mir_pg)"
# Unpublished — no crate here has a release channel (release.yml ships only the npm packages/ family), and this is what lets deny.toml's allow-wildcard-paths accept the sibling path deps.
publish = false

# The workspace lint table (pedantic + nursery at warn), absent here until
# 2026-09-18 and never by an argument anybody made. It is not a free omission:
# eight pedantic findings surfaced only when code MOVED out of this crate into
# one that does inherit the table, so the alternative — leaving it off and
# letting the destination crate catch them — is a finding that waits for a
# refactor. The crates that were still without it — `fossil-graph-schema`
# and `xtask` among them — now inherit it too, so
# `grep -L lints crates/*/Cargo.toml` is empty and this is a policy again.
[lints]
workspace = true

[lib]
doctest = false

[dependencies]
fossil-base = { path = "../fossil-base" }
# The `@conn`/relative-path rule, which used to be a module of `fossil-base`.
# It depends on nothing, so this edge costs a `std::path` join and no build time.
fossil-locator = { path = "../fossil-locator" }
fossil-hir = { path = "../fossil-hir" }
# `FOSSIL_MEM_PROBE` — peak RSS and elapsed seconds per phase of a run. A
# dependency-free leaf.
fossil-mem-probe = { path = "../fossil-mem-probe" }
fossil-mir = { path = "../fossil-mir" }
# The format: `fossil.json`'s structs and the writer's fixed columns. WASM-clean.
fossil-sinks = { path = "../fossil-sinks" }
# The one IO path of a run: sources read and the corpus written through
# `object_store` stores built from vended credentials. `object-store` only — the
# `js` host adapter is `fossil-df-wasm`'s.
fossil-storage = { path = "../fossil-storage", features = ["object-store"] }
# `Storage::stores` hands `object_store` stores to `DataFusion`, and `put` takes
# `Bytes`; `futures` drives the one-task session's streams. All wasm-clean.
object_store = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
url = { workspace = true }
# The canonical graph-schema contract — the metadata fossil-df produces and the
# manifest materializes from (the universal substrate's single source).
fossil-graph-schema = { path = "../fossil-graph-schema" }
# The program-resident output descriptor (ShEx) that drives edge/cardinality
# classification, threaded into execute_graph as an argument, never read off
# the db. This
# crate is where it stops: `to_graph_schema()` is called here and only the
# format-neutral schema crosses into `fossil_mir::apply_output_shape`.
fossil-descriptors-output = { path = "../fossil-descriptors-output" }
# RDF input seam: Turtle parsing for `io.rdf` sources → Arrow rows. Pure Rust,
# WASM-clean (the oxigraph parsers rudof's ShEx already pulls) — RDF is decoded
# at the I/O border, same as in the browser.
oxttl = { workspace = true }
oxrdf = { workspace = true }
# `default-features = false` drops datafusion's `sql` frontend (we build plans
# via the DataFrame/LogicalPlan API, not `ctx.sql()`) and its own `compression`
# feature — shrinking the wasm surface. We KEEP `parquet`: `io.parquet` sources
# must be READ (locally and, in the browser, remotely by signed URL — design C2).
# CSV/JSON reading is core (ungated). Re-add a feature here if a plan op needs it.
#
# ⚠️ This does NOT remove the `zstd` C dep: datafusion 54 HARDCODES
# `arrow-ipc` with `features=["lz4","zstd"]` in datafusion-common /
# datafusion-datasource-arrow / datafusion-physical-plan (not behind any
# feature). So `zstd-sys` cannot be cut from the feature graph — the wasm32
# build needs a wasm-capable clang to compile zstd-C (verified 2026-06-09):
#   CC_wasm32_unknown_unknown=<llvm>/clang AR_wasm32_unknown_unknown=<llvm>/llvm-ar \
#     cargo build -p fossil-df --target wasm32-unknown-unknown
# (Apple's system clang lacks the wasm target; `brew install llvm` provides one.)
# Cutting zstd entirely would require a `[patch.crates-io]` fork of those three
# subcrates — deferred. The wasm CI job must install LLVM.
#
# `nested_expressions` is ON because a catalogue row asked for it, and that is
# the only reason a feature is on here. `str.split` lowers to `string_split`,
# which reconciles to DataFusion's `string_to_array` — a function that lives in
# the nested-expressions package and is therefore absent from
# `all_default_functions()`. The row was UNRENDERABLE on this engine for want of
# a feature flag, which is a different thing from unrenderable for want of a
# capability, and it was filed beside the ones that cannot be done at all.
#
# `crypto_expressions` is deliberately OFF. It is the sibling package, and its
# `sha256` had exactly one consumer — `anon.hash` — which is gone from the
# language. Turning it on would grow the wasm surface for a function no
# template says.
datafusion = { version = "54", default-features = false, features = [
  "parquet",
  "nested_expressions",
] }

# `src/report.rs` — what a run tells its caller, and what `serde-wasm-bindgen`
# hands JS; `schemars` derives the TypeScript of it (`xtask/tests/wire.rs`).
serde = { workspace = true }
schemars = { workspace = true }
# The JSON array reader (`read_json_source`). `arrow-json` decodes a slice of
# `serde_json::Value`, so the parse and the decode speak the same type; both are
# pure Rust, so neither costs the wasm build anything.
serde_json = { workspace = true }
thiserror = { workspace = true }
# The stdlib UDFs no engine ships. Pure Rust, no C, wasm-clean — the logic is
# the function's, not the database's, which is why it can live in the compiler
# ring at all.
slug = { workspace = true }
unicode-normalization = { workspace = true }

[dev-dependencies]
# `tests/programs.rs` keeps each conformance program's artefacts as files.
expect-test = { workspace = true }
# `tests/write.rs` reads the corpus back with a second engine: a corpus only
# one writer can read is not a corpus. `tests/builtin_smoke.rs` binds every
# stdlib template on it, and `tests/corpus_exec.rs` writes the native half of
# the cross-engine parity baseline (`tests/wasm_parity/`), digested with `sha2`.
duckdb = { workspace = true }
sha2 = { workspace = true }
# `tests/write.rs` wraps an `object_store` store to record the order of the
# writes, and the trait is an `async_trait`.
async-trait = { workspace = true }
# `NativeSystem` and the line-format decoder moved out of `fossil-base`'s
# production surface into its `test_support` module, which is behind this
# feature — they had no consumer that was not a test.
fossil-base = { path = "../fossil-base", features = ["test-support"] }
# `tests/pipeline.rs` builds a `SourceAnchor` itself — a regular dependency is
# invisible to an integration test, which links the crate plus its dev deps only.
fossil-locator = { path = "../fossil-locator" }
# Dev-only: the tests drive the async executor on a current-thread runtime. The
# library holds no tokio at all — the browser drives it from JS's event loop.
tokio = { workspace = true }
fossil-hir = { path = "../fossil-hir" }
# `tests/rdf_source.rs` builds a `ShExDescriptor` to exercise the ShEx→edge path
# end to end. It names the decode directly because `fossil-descriptors-output`
# stopped re-exporting ShEx types: a host may know what ShEx is, the compiler
# may not.
fossil-shex = { path = "../fossil-shex" }
tempfile = { workspace = true }
# tests/pipeline.rs builds the op list by hand — the MIR operators, which no
# `.fossil` reaches yet — so it spells `SmolStr` directly.
smol_str = { workspace = true }
fossil-graph-schema = { path = "../fossil-graph-schema" }
fossil-sinks = { path = "../fossil-sinks" }
# `tests/support/native.rs` is the native test host the deleted `fossil` binary
# was: its check half DESCRIBEs each source before the compile, as an editor
# does, and the executor never does.
fossil-introspect = { path = "../fossil-introspect" }
# The check host's `System::descriptors` names the cache's type.
fossil-descriptors-input = { path = "../fossil-descriptors-input" }
# `tests/provider_registry.rs` lists the registry through `providers`.
fossil-lineage = { path = "../fossil-lineage" }
# `tests/census` counts `PROPERTY` nodes in the CST.
fossil-syntax = { path = "../fossil-syntax" }
# `tests/programs.rs` renders each diagnostic as `fossil check` rendered it —
# graphical, unicode — into the committed `expected/diagnostic.txt`.
miette = { workspace = true, features = ["fancy"] }
# `tests/documents.rs` edits a registered document through its Salsa input and
# counts `WillExecute` events.
salsa = { workspace = true }
