[package]
name = "fossil-profile"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "What a source is — columns, candidate keys, inclusions, a sample — decided as queries and read from their answers, running nothing."
# Unpublished — no crate here has a release channel (release.yml ships only the npm packages/ family), and this is what lets deny.toml's allow-wildcard-paths accept the sibling path deps.
publish = false

[lints]
workspace = true

[dependencies]
# `providers::DATA` — the `io.` rows, which choose the reader a source is read
# with — and `NativeReader`, its table function and option keyword; and
# `sources::InferredDescriptor`, the columns a profile finds, which is the
# value of the input a host writes them into.
fossil-base = { path = "../fossil-base" }
# `Primitive`, the lattice a column's Arrow type maps onto.
fossil-graph-schema = { path = "../fossil-graph-schema" }
# The type of each column an engine answers with: every engine fossil profiles
# on answers in Arrow. The types alone, so this crate still runs nothing.
arrow-schema = { workspace = true }
# A profile crosses to a host as JSON, and `@fossil-lang/types` declares its
# shape from this schema (`crates/xtask/tests/wire.rs`).
schemars = { workspace = true }
serde = { workspace = true }
smol_str = { workspace = true }

[dev-dependencies]
# The engine its tests run the plan on. A dev
# edge: nothing that depends on this crate links a database through it.
duckdb = { workspace = true }
tempfile = { workspace = true }
