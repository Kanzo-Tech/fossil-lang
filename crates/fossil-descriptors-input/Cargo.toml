[package]
name = "fossil-descriptors-input"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Input descriptors (CSVW, JSON Schema, Parquet, XSD) for forward type propagation"

[lints]
workspace = true

[dependencies]
# Phase 1: trait + minimal CSV stub. csv / roxmltree / jsonschema stay deferred
# to Phase 5 STDL-06 (already declared at workspace level for inheritance).
#
# Phase 3 plan 03-02 (CORE-05): consumes serde + serde_json for the CSVW thin
# parser at `src/csvw.rs`. Per the Serious N2 fix to the Wave-1 plan layout,
# the consumer crate owns its dep declarations; plan 03-01 owns the
# workspace-level `serde` + `serde_json` entries in the root Cargo.toml.
indexmap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# `serde` feature on smol_str opt-in for `InferredDescriptor` JSON round-trip
# (ADR-0037 + plan 13-01). Other consumers of smol_str in the workspace remain
# unaffected — Cargo feature unification merges features additively.
smol_str = { workspace = true, features = ["serde"] }
thiserror = { workspace = true }
