[package]
name = "fossil-hir"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "High-level IR: name resolution, item tree, type ADT, bidirectional checker"
# Unpublished — no crate here has a release channel (release.yml ships only the npm packages/ family), and this is what lets deny.toml's allow-wildcard-paths accept the sibling path deps.
publish = false

[lints]
workspace = true

[dependencies]
# fossil-hir collapses what was three crates (fossil-types + fossil-resolve +
# fossil-typeck) into one: they shared every type and could not be built apart.
fossil-base = { path = "../fossil-base" }
fossil-syntax = { path = "../fossil-syntax" }
# Phase 3: the checker (plan 03-05) consumes CsvwDescriptor via this path dep.
# NOTE: the pre-existing cargo-deny wildcard warnings on path deps are
# PRE-EXISTING from plans 02-01..02-07 (deferred chore — see
# .planning/phases/02-full-grammar-hir-foundation/deferred-items.md).
fossil-descriptors-input = { path = "../fossil-descriptors-input" }
# The primitive lattice `TyKind::Primitive` carries, AND the format-neutral
# shape vocabulary (`OutputShapes` / `Shape` / `PropertyConstraint` / `Occurs` /
# `Rejection`) the checker reads instead of a schema language. This crate names
# no schema language at all: a host installs a decoder
# (`fossil_base::ShapeDecoder`) and the compiler is handed a decoded value.
fossil-graph-schema = { path = "../fossil-graph-schema" }
salsa = { workspace = true }
indexmap = { workspace = true }
rowan = { workspace = true }
smol_str = { workspace = true }
thiserror = { workspace = true }
# Phase 3 plan 03-05 did-you-mean diagnostics; declared in Wave 0 to avoid
# re-touching this Cargo.toml mid-wave.
strsim = { workspace = true }

[dev-dependencies]
# Plan 03-08 diagnostic golden-file corpus: insta snapshots over the neutral
# shape vocabulary, built by hand (see tests/diagnostic_corpus.rs module docs).
insta = { workspace = true }
# The host with a shape decoder installed, formerly `src/test_support.rs` here.
# A DEV-dependency and a DEV-only feature: the decoder reads a line format with
# no schema language behind it, which is what lets this crate test against a
# resolved shape without naming ShEx.
fossil-base = { path = "../fossil-base", features = ["test-support"] }
