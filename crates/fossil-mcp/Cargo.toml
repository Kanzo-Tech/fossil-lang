[package]
name = "fossil-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "MCP server exposing the fossil-graph verb surface over native DuckDB."
# Unpublished — no crate here has a release channel (release.yml ships only the npm packages/ family), and this is what lets deny.toml's allow-wildcard-paths accept the sibling path deps.
publish = false

[lib]
name = "fossil_mcp"
path = "src/lib.rs"

[[bin]]
name = "fossil-mcp"
path = "src/main.rs"

[dependencies]
fossil-graph = { path = "../fossil-graph" }
fossil-resolver = { path = "../fossil-resolver" }
duckdb = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
secrecy = { workspace = true }
rmcp = { workspace = true }
# tokio unconditionally: this crate links `DuckDB`, is nobody's dependency, and
# is outside the cdylib closure the WASM gate walks — so it never reaches a
# wasm build. `crates/xtask/tests/tokio_placement.rs` derives that and fails if
# it stops being true.
tokio = { workspace = true }
# NO schemars here, and that is the point rather than an omission. This crate
# carried `schemars = "1"` because rmcp's `#[tool]` macro derives against 1.x
# while the workspace pins 0.8 for `fossil-graph`; the two coexisted and the
# note said the boundary was only ever crossed by `serde_json`. The macro
# router is gone — the six tools are built from `fossil_graph::Verb`, whose
# `params_schema()` hands over a `serde_json::Value` — so the crossing is now
# the only thing there is, and there is no second `JsonSchema` in the graph to
# keep inert. Reintroducing a direct schemars dependency here means a second
# copy of the wire contract; make the case on the page before you do.

# The manifest model, for the two names a path is composed from:
# `manifest::Container` and `manifest::TILES_FILE`. It was a dev-dependency while
# `register_views_sql` hard-coded its paths; it is a dependency now that the
# paths come out of the manifest instead of out of this file.
fossil-sinks = { path = "../fossil-sinks" }


[lints]
workspace = true
