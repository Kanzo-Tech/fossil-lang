[package]
name = "fossil-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Native execution runtime via DuckDB (bundled C++); WASM-host execution lives in fossil-wasm"
# Unpublished — no crate here has a release channel (release.yml ships only the npm packages/ family), and this is what lets deny.toml's allow-wildcard-paths accept the sibling path deps.
publish = false

[lints]
workspace = true

[dependencies]
# NATIVE-ONLY (per CLAUDE.md Project Layout). The cfg-tripwire in
# src/lib.rs enforces the workspace contract that this crate is never built
# for wasm32. The `bundled` feature is inherited from the workspace pin
# `duckdb = { version = "1.10502", features = ["bundled"] }` (~80MB C++,
# 3-5 min cold-cache compile).
duckdb = { workspace = true }

# The six `native_udf_only` UDF impl crates (unicode-normalization, slug,
# voca_rs, hmac, sha2, uuid) were here for `src/udf.rs`. Ruling 15 of
# `SURFACE-PLAN.md` deleted the `Udf` lowering kind and the module with it, so
# the language needs no native crate to run a catalogued function. `sha2`
# survives as a DEV-dependency below, for the parity digest — a different job.

# GraphAr materialiser. fossil-sinks emits the WriteSqlPlan +
# ManifestSet (WASM-clean planning side); this crate (native) runs the
# COPY against DuckDB and threads the resolver's cloud-config into SET
# statements. fossil-resolver is itself native-only by intent (cloud
# credentials must not cross the wasm boundary). thiserror gives the
# materialise step typed errors so CLI hosts can render them via miette
# without substring-matching.
fossil-sinks = { path = "../fossil-sinks" }
fossil-resolver = { path = "../fossil-resolver" }
thiserror = { workspace = true }

serde_json = { workspace = true }

# The memory probe (`FOSSIL_MEM_PROBE`) — both halves of the write path report
# through it (the DataFusion executor in fossil-df and the DuckDB layout pass
# here) and neither may depend on the other, so it is a dependency-free leaf of
# its own. Regular dep, not dev: the instrument has to be in the binary that
# writes ten million vertices, which is the only place the number exists.
#
# It used to be a module in `fossil-base`, and that single `use` was this
# crate's ONLY edge to the compiler substrate — a native execution runtime
# linking the Salsa `Db` trait to time a phase. There is no `fossil-base` line
# here now, and there should not be one again.
fossil-mem-probe = { path = "../fossil-mem-probe" }

[dev-dependencies]
# Graph-verb integration (tests/graph_verbs.rs): deserialise dispatch JSON into the
# verb result structs.
serde = { workspace = true }
# Cross-engine parity baseline producer (tests/corpus_exec.rs): SHA-256 of
# the canonical ordered result-set serialization + JSON writer for
# native_baseline.json. Both are native-only test deps (the runtime crate is
# native-only anyway via the wasm32 cfg-tripwire).
sha2 = { workspace = true }
# Native-builtin smoke (tests/builtin_smoke.rs): drive a SELECT <duckdb_name>(...)
# per pure_sql Builtin entry from the authoritative catalog so a renamed/removed
# builtin fails CI on native DuckDB. fossil-hir is WASM-clean; it
# is a dev-dep only here so the native-only runtime's wasm32 tripwire is unaffected.
fossil-hir = { path = "../fossil-hir" }
# `salsa` was here too, and no test in this crate has ever named it: the module
# doc says this crate runs OUTSIDE the query graph, and it does. It went with
# `fossil-mir` / `fossil-descriptors-output` / `smol_str` / `tempfile`, which
# served a `tests/graphar_decomp.rs` that no longer exists.
