[package]
name = "fossil-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Native execution runtime via DuckDB (bundled C++); WASM-host execution lives in fossil-wasm"

[lints]
workspace = true

[dependencies]
# NATIVE-ONLY (per ADR-0002 + CLAUDE.md Project Layout). The cfg-tripwire in
# src/lib.rs enforces the workspace contract that this crate is never built
# for wasm32. The `bundled` feature is inherited from the workspace pin
# `duckdb = { version = "1.10502", features = ["bundled"] }` (~80MB C++,
# 3-5 min cold-cache compile per RESEARCH.md Risk 6).
duckdb = { workspace = true }

# Native_udf_only stdlib UDF impl crates (STDL-03/05). All native-only — this
# crate carries the wasm32 cfg-tripwire so none of these can leak into the WASM
# gate (Pitfall 3). sha2 (hex hashing for hmac) is workspace-pinned at 0.10.
unicode-normalization = { workspace = true }
slug = { workspace = true }
voca_rs = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# SC#1 cross-engine parity baseline producer (tests/corpus_exec.rs): SHA-256 of
# the canonical ordered result-set serialization + JSON writer for
# native_baseline.json. Both are native-only test deps (the runtime crate is
# native-only anyway via the wasm32 cfg-tripwire).
sha2 = { workspace = true }
serde_json = { workspace = true }
# SC#1 native-builtin smoke (tests/builtin_smoke.rs): drive a SELECT <duckdb_name>(...)
# per pure_sql Builtin entry from the authoritative catalog so a renamed/removed
# builtin fails CI on native DuckDB (Pitfall 4). fossil-registry is WASM-clean; it
# is a dev-dep only here so the native-only runtime's wasm32 tripwire is unaffected.
fossil-registry = { path = "../fossil-registry" }
# SC#4 real-files fixture (tests/graphar_decomp.rs): build a 2-shape ShEx + a
# hand MirGraph, run the 05-08 codegen_sql_with_descriptor chunked COPY on native
# DuckDB, and assert real Parquet files on disk. All dev-deps only — the
# native-only runtime's wasm32 tripwire is unaffected (these crates are WASM-gated
# anyway). codegen_sql_with_descriptor is plain-Rust (no Salsa key for the
# descriptor), so the runtime just calls it inside a tracked frame.
fossil-base = { path = "../fossil-base" }
fossil-hir = { path = "../fossil-hir" }
fossil-mir = { path = "../fossil-mir" }
fossil-codegen = { path = "../fossil-codegen" }
fossil-descriptors-output = { path = "../fossil-descriptors-output" }
fossil-sinks = { path = "../fossil-sinks" }
salsa = { workspace = true }
smol_str = { workspace = true }
