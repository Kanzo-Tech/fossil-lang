[package]
name = "fossil-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Native execution runtime via DuckDB (bundled C++); WASM-host execution lives in fossil-wasm"

[lints]
workspace = true

[dependencies]
# NATIVE-ONLY (per ADR-0002 + CLAUDE.md Project Layout). The cfg-tripwire in
# src/lib.rs enforces the workspace contract that this crate is never built
# for wasm32. The `bundled` feature is inherited from the workspace pin
# `duckdb = { version = "1.10502", features = ["bundled"] }` (~80MB C++,
# 3-5 min cold-cache compile per RESEARCH.md Risk 6).
duckdb = { workspace = true }

# Native_udf_only stdlib UDF impl crates (STDL-03/05). All native-only — this
# crate carries the wasm32 cfg-tripwire so none of these can leak into the WASM
# gate (Pitfall 3). sha2 (hex hashing for hmac) is workspace-pinned at 0.10.
unicode-normalization = { workspace = true }
slug = { workspace = true }
voca_rs = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true }

# W0b/4 — GraphAr materialiser. fossil-sinks emits the WriteSqlPlan +
# ManifestSet (WASM-clean planning side); this crate (native) runs the
# COPY against DuckDB and threads the resolver's cloud-config into SET
# statements. fossil-resolver is itself native-only by intent (cloud
# credentials must not cross the wasm boundary). thiserror gives the
# materialise step typed errors so CLI hosts can render them via miette
# without substring-matching.
fossil-sinks = { path = "../fossil-sinks" }
fossil-resolver = { path = "../fossil-resolver" }
thiserror = { workspace = true }

# W2-06 — native DuckExecutor: fossil-graph owns the verb→SQL (WASM-clean); this
# crate runs that SQL against bundled DuckDB and converts rows to JSON. serde_json
# is promoted from a dev-dep to a regular dep for the row→Value conversion.
fossil-graph = { path = "../fossil-graph" }
serde_json = { workspace = true }

# The memory probe (`FOSSIL_MEM_PROBE`) lives in the substrate because both
# halves of the write path report through it — the DataFusion executor in
# fossil-df and the DuckDB layout pass here — and neither may depend on the
# other. Regular dep, not dev: the instrument has to be in the binary that
# writes ten million vertices, which is the only place the number exists.
fossil-base = { path = "../fossil-base" }

[dev-dependencies]
# W2-06 integration (tests/graph_verbs.rs): deserialise dispatch JSON into the
# verb result structs.
serde = { workspace = true }
# SC#1 cross-engine parity baseline producer (tests/corpus_exec.rs): SHA-256 of
# the canonical ordered result-set serialization + JSON writer for
# native_baseline.json. Both are native-only test deps (the runtime crate is
# native-only anyway via the wasm32 cfg-tripwire).
sha2 = { workspace = true }
# SC#1 native-builtin smoke (tests/builtin_smoke.rs): drive a SELECT <duckdb_name>(...)
# per pure_sql Builtin entry from the authoritative catalog so a renamed/removed
# builtin fails CI on native DuckDB (Pitfall 4). fossil-hir is WASM-clean; it
# is a dev-dep only here so the native-only runtime's wasm32 tripwire is unaffected.
fossil-hir = { path = "../fossil-hir" }
# `salsa` was here too, and no test in this crate has ever named it: the module
# doc says this crate runs OUTSIDE the query graph, and it does. It went with
# `fossil-mir` / `fossil-descriptors-output` / `smol_str` / `tempfile`, which
# served a `tests/graphar_decomp.rs` that no longer exists. ADR-0050 §3.
