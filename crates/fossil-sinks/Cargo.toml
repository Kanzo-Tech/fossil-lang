# What a sink is handed, and the sinks: one module per output format, each
# behind the cargo feature of its name. `fossil-exec` runs a program into a
# `Graph` and a sink writes it. Compiles to wasm32 and natively alike.
[package]
name = "fossil-sinks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "The output formats of a fossil graph, one feature each"
# Unpublished, as every crate here: what lets deny.toml's allow-wildcard-paths accept the sibling path deps.
publish = false

[lints]
workspace = true

[lib]
doctest = false

[features]
# An Apache GraphAr graph: the chunks, `mapping.ttl` and `fossil.graph.yml` last.
graphar = [
  "dep:fossil-base",
  "dep:fossil-hir",
  "dep:fossil-mir",
  "dep:fossil-storage",
  "dep:graphar-info",
  "dep:graphar-parquet",
  "dep:object_store",
  "dep:oxrdf",
  "dep:thiserror",
  "dep:tracing",
]

# The triples of a graph, one N-Triples line each: the definition of what a
# program means as RDF.
ntriples = [
  "dep:fossil-mir",
  "dep:fossil-storage",
  "dep:object_store",
  "dep:oxrdf",
  "dep:thiserror",
  "dep:tracing",
]

[dependencies]
# A graph is Arrow relations: `datafusion`'s re-export, the engine's own build.
datafusion = { workspace = true }
# The program's graph type a sink writes the relations under.
fossil-graph-schema = { path = "../fossil-graph-schema" }
# `EdgeDrops` reaches JS in a run's report; `schemars` derives its TypeScript
# (`xtask/tests/wire.rs`).
serde = { workspace = true }
schemars = { workspace = true }

# --- graphar ---
fossil-base = { path = "../fossil-base", optional = true }
# A language tag is held to BCP 47 by the checker's own test (`terms`).
fossil-hir = { path = "../fossil-hir", optional = true }
# The mapping that says what the tables mean as RDF is `fossil_mir::describe`'s.
fossil-mir = { path = "../fossil-mir", optional = true }
# The graph is written through the job's store, built from a vended credential.
fossil-storage = { path = "../fossil-storage", features = ["object-store"], optional = true }
object_store = { workspace = true, optional = true }
# The information files and the Parquet chunks are `graphar-*`'s, and this
# module lays out and counts what it hands them.
graphar-info = { workspace = true, optional = true }
graphar-parquet = { workspace = true, optional = true }
# A subject is validated as an IRI before it is a vertex (`layout`).
oxrdf = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
