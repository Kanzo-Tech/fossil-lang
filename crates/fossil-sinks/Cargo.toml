[package]
name = "fossil-sinks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "The canonical GraphAr manifest model — the tiling a corpus declares"
# Unpublished — no crate here has a release channel (release.yml ships only the npm packages/ family), and this is what lets deny.toml's allow-wildcard-paths accept the sibling path deps.
publish = false

[lints]
workspace = true

[dependencies]
# The privacy policy vocabulary, for `AbsentQuasiIdentifier` alone. The
# dependency runs THIS WAY on purpose: the manifest records the outcome of a
# policy check, so it names policy vocabulary, and `fossil-policy` names nothing
# — it is a serde/serde_json/thiserror leaf and knows nothing about GraphAr.
fossil-policy = { path = "../fossil-policy" }
# `Cardinality` alone, and the dependency runs THIS WAY for the same reason
# `fossil-policy` does: a manifest records what a compiler decided, so it names
# the substrate contract, and `fossil-graph-schema` names nothing — it is a
# serde leaf. This is NOT the objection the `arrow-schema` note below raises:
# that one is against taking a TYPE SYSTEM (`fossil-hir::Primitive`) into the
# manifest layer. A cardinality is not a type, it is the shape a predicate was
# declared with, and dropping it here is what made an edge's `{1,1}` a fact the
# corpus could not state.
fossil-graph-schema = { path = "../fossil-graph-schema" }
# A plan + manifest generator, NOT an I/O library: it declares the tiling and never
# byte-writes Parquet, so the only emission here is YAML.
serde = { workspace = true }
serde_yaml_ng = { workspace = true }
# `arrow-schema` sub-crate ONLY — NOT the `arrow` umbrella crate, whose default features
# pull `arrow-ipc`/`arrow-csv`, and with them `mio`, which wasm32 cannot build.
# `arrow_schema::DataType` is the single authority for GraphAr `data_type` spellings, and it
# is depended on ALONE rather than fossil-hir's `Primitive` so the manifest layer stays
# decoupled from the type system.
arrow-schema = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
# Dev-only, and for one test: `tests/level_plan_vectors.rs` reads
# `apps/corpus/guards/vectors.json` at runtime rather than transcribing its rows,
# so a border edited on the other writer's side turns this crate red. It is a
# dev-dependency, so it reaches no wasm build and no consumer.
serde_json = { workspace = true }
