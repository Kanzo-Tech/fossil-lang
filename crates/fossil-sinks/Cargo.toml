[package]
name = "fossil-sinks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "The fossil/1 corpus format — fossil.json and the writer's fixed columns"
# Unpublished — no crate here has a release channel (release.yml ships only the npm packages/ family), and this is what lets deny.toml's allow-wildcard-paths accept the sibling path deps.
publish = false

[lints]
workspace = true

[dependencies]
# The format declares what the writer emits and never byte-writes Parquet, so
# the only emission here is JSON — `fossil.json`, parsed by a browser with
# `JSON.parse`. Both leaves are wasm-clean.
serde = { workspace = true }
serde_json = { workspace = true }
# The JSON Schema of `fossil.json`, derived from the structs rather than
# written beside them — `fossil.schema.json`, which `tests/schema.rs` holds
# against them. Pure Rust, wasm-clean; `fossil-lineage` derives with it too.
schemars = { workspace = true }
# `arrow-schema` sub-crate ONLY — NOT the `arrow` umbrella crate, whose default features
# pull `arrow-ipc`/`arrow-csv`, and with them `mio`, which wasm32 cannot build.
# `arrow_schema::DataType` is what `data_type_name` spells, and it is depended on ALONE
# rather than fossil-hir's `Primitive` so the format stays decoupled from the type system.
arrow-schema = { workspace = true }

[dev-dependencies]
expect-test = { workspace = true }
