[package]
name = "fossil-sinks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Output sinks: GraphAr Parquet writer (arrow + parquet)"
# Unpublished — no crate here has a release channel (release.yml ships only the npm packages/ family), and this is what lets deny.toml's allow-wildcard-paths accept the sibling path deps.
publish = false

[lints]
workspace = true

[dependencies]
# Phase 5 SINK-02/06. The GraphAr "writer" is DuckDB COPY —
# fossil-sinks is a plan + manifest generator, NOT an I/O library, so it never byte-writes
# Parquet from Rust. It therefore depends on `arrow-schema` ONLY (DataType -> data_type
# string names; pulls no mio/arrow-ipc/arrow-csv) and `serde_yaml_ng` (manifest emission).
# This keeps fossil-sinks WASM-clean — it joins the WASM gate as the 7th gated crate.
serde = { workspace = true }
serde_yaml_ng = { workspace = true }
# `arrow-schema` sub-crate ONLY — NOT the `arrow` umbrella crate, whose default features
# pull `arrow-ipc`/`arrow-csv` (mio leak; SC#5). `arrow_schema::DataType`
# is the single authority for GraphAr `data_type` string spellings — never hand-rolled;
# we deliberately depend on it ALONE rather than fossil-hir's `Primitive` so the manifest layer
# stays decoupled from the type system and the WASM dep surface is minimal.
arrow-schema = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
