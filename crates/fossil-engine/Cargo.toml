[package]
name = "fossil-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Native orchestration surface — compile + run + catalog + check + refs + providers. The fossil binaries are thin shells over this."

[lints]
workspace = true

[dependencies]
# Compiler core + IR.
fossil-base     = { path = "../fossil-base" }
fossil-hir      = { path = "../fossil-hir" }
fossil-mir      = { path = "../fossil-mir" }
fossil-registry = { path = "../fossil-registry" }
# Shared IDE façade: `refs`/`providers` delegate to `fossil_ide::{source_refs,
# providers}` so the native CLI and the browser WASM run ONE implementation
# (ADR-0024 "one crate, two hosts"). WASM-clean; safe to depend on from native.
fossil-ide      = { path = "../fossil-ide" }
# Descriptors (input forward-propagation + output shape).
fossil-descriptors-input  = { path = "../fossil-descriptors-input" }
fossil-descriptors-output = { path = "../fossil-descriptors-output" }
# The DataFusion executor — the SINGLE `run` path (lower_to_mir_pg → execute_graph
# → write_to_dir). Re-exports `OutputDescriptorKind`. DuckDB now serves only the
# layout post-pass + CSV type pre-introspection.
fossil-df           = { path = "../fossil-df" }
# Native runtime (layout + secrets) + sinks + cloud-path resolver.
fossil-runtime      = { path = "../fossil-runtime" }
fossil-sinks        = { path = "../fossil-sinks" }
fossil-resolver     = { path = "../fossil-resolver" }
# The `RunStatus` / `SourceRefInfo` / `ProviderInfo` / `CatalogInput` wire types
# the engine produces (one source of truth; keasy reuses them).
fossil-run-status = { path = "../fossil-run-status" }

duckdb   = { workspace = true }
regex    = { workspace = true }
smol_str = { workspace = true }
serde    = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# Credentials never ride argv/env — kept off Debug via SecretString.
secrecy  = { workspace = true }
# Error surface (no `fancy`/`derive` — the binary owns rustc-style rendering).
miette   = { workspace = true }
tracing  = { workspace = true }

[dev-dependencies]
secrecy = { workspace = true }
# The artefact validator (tests/conformance.rs) writes a corpus and reads it
# back with plain SQL — never through our own reader. tempfile gives it a
# destination; duckdb is already a regular dep for the layout pass.
tempfile = { workspace = true }
