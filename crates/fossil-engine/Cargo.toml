[package]
name = "fossil-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Native orchestration surface — compile + run + check + refs + providers. The fossil binaries are thin shells over this."
# Unpublished — no crate here has a release channel (release.yml ships only the npm packages/ family), and this is what lets deny.toml's allow-wildcard-paths accept the sibling path deps.
publish = false

[lints]
workspace = true

[dependencies]
# Compiler core + IR.
fossil-base     = { path = "../fossil-base" }
fossil-hir      = { path = "../fossil-hir" }
# The CST, for `census`: the properties an author WROTE are `PROPERTY` nodes,
# and the count that matters is theirs against the `HirBody`'s. Reading the
# survivors alone cannot see a property lowering dropped.
fossil-syntax   = { path = "../fossil-syntax" }
fossil-mir      = { path = "../fossil-mir" }
fossil-lineage = { path = "../fossil-lineage" }
# Descriptors: the input forward-propagation table, and the output side — the
# `SHEX` decoder row this host installs plus the `OutputDescriptorKind` the
# executor is handed.
fossil-descriptors-input  = { path = "../fossil-descriptors-input" }
fossil-descriptors-output = { path = "../fossil-descriptors-output" }
# `fossil-shex` was here for one consumer: `read_output_shape`, which named
# `ShExDescriptor::from_reader` directly and could therefore read only ShExJ
# while the checker read both syntaxes through the `shex` ROW. The run goes
# through the same row now, so the engine names no schema language at all.
# Pre-introspection types a column: the DuckDB type string lands on the lattice.
fossil-graph-schema = { path = "../fossil-graph-schema" }
# The DataFusion executor — the SINGLE `run` path (lower_to_mir_pg → execute_graph
# → write_to_dir). Re-exports `OutputDescriptorKind`. DuckDB now serves only the
# layout post-pass + CSV type pre-introspection.
fossil-df           = { path = "../fossil-df" }
# The layout post-pass — `enrich_layout`, called by `enrich_written_layout`
# after the write. It links no engine and it is not the «native runtime + secrets
# + cloud-path resolver» this line used to call it: `materialize.rs` took the
# resolver with it, and `install_secret` went with the `DuckDB` connection.
fossil-layout       = { path = "../fossil-layout" }
fossil-sinks        = { path = "../fossil-sinks" }
# The `RunStatus` / `SourceRefInfo` / `ProviderInfo` wire types
# the engine produces (one source of truth; keasy reuses them).
fossil-run-status = { path = "../fossil-run-status" }

regex    = { workspace = true }
smol_str = { workspace = true }
serde    = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# Credentials never ride argv/env — kept off Debug via SecretString.
secrecy  = { workspace = true }
# Error surface (no `fancy`/`derive` — the binary owns rustc-style rendering).
miette   = { workspace = true }
tracing  = { workspace = true }

[dev-dependencies]
# The host half this crate stopped doing. Production callers (`fossil-cli`) take
# it as a real dependency; the five test files here that drive `check`/`run` need
# the descriptor cache filled first, exactly as the CLI does it.
fossil-introspect = { path = "../fossil-introspect" }
# The tests read back the Parquet a run wrote — the same «test convenience, not a
# dependency of the language» `fossil-layout` demoted.
duckdb = { workspace = true }
# `fossil-hir` is a regular dependency above, and an integration test cannot see
# one: `tests/` links the crate plus its DEV deps only. `tests/stdlib_return_types.rs`
# reads the catalogue directly, because the question it asks — does the type the
# checker believes match the type the engine produces — has the registry on one
# side and a real DuckDB on the other, and this is the only crate that carries both.
fossil-hir = { path = "../fossil-hir" }
secrecy = { workspace = true }
# The conformance-set harness (tests/programs.rs) keeps each program's rendered
# diagnostic as a committed artefact, and it has to be the text `fossil check`
# prints — so it renders through miette's `GraphicalReportHandler`, which needs
# `fancy-base`. The LIBRARY still takes miette bare: rustc-style rendering is the
# binary's job, and a test that renders is not the engine rendering.
miette = { workspace = true, features = ["fancy-no-syscall"] }
# The shape-document invalidation test edits a registered document through its
# Salsa input (`Setter::set_text`) and counts `WillExecute` events — the only
# way to assert that editing the document re-runs the checker and that editing
# the program does not re-run the decode.
salsa = { workspace = true }
# The artefact validator (tests/conformance.rs) writes a corpus and reads it
# back with plain SQL — never through our own reader. tempfile gives it a
# destination; duckdb is already a regular dep for the layout pass.
tempfile = { workspace = true }
